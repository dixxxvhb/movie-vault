<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>The Vault Building</title>
    <meta name="description" content="NO VACANCY prototypes: the Court and the Strip, laid out from the ledger." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&display=swap" />
    <style>
      /* Night motel: one look, deliberately dark. HUD hugs the edges so the building owns the screen. */
      :root {
        color-scheme: dark;
        --night: #0a1020;
        --ink: #0d1420;
        --cream: #efe4cc;
        --dim: #9aa3b5;
        --sodium: #ffb35c;
        --panel: rgba(10, 16, 32, 0.82);
        --line: rgba(239, 228, 204, 0.18);
        --display: Georgia, "Times New Roman", serif;
        --label: "Oswald", "Arial Narrow", system-ui, sans-serif;
        --body: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      html, body, #root { margin: 0; height: 100%; background: var(--night); overflow: hidden; color: var(--cream); }
      body { font: 15px/1.45 var(--body); }
      .app { position: fixed; inset: 0; }
      .app canvas { touch-action: none; }
      #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--dim); font: 500 13px var(--label); letter-spacing: .2em; text-transform: uppercase; background: var(--night); z-index: 100; }
      .msg { padding: 2rem; color: var(--dim); }
      button { font: inherit; color: inherit; cursor: pointer; }
      button:focus-visible, a:focus-visible { outline: 2px solid var(--sodium); outline-offset: 2px; }
      .fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .2s ease; z-index: 30; }
      .fade.on { opacity: 1; }
      @media (prefers-reduced-motion: reduce) { .fade { transition: none; } }

      .top { position: fixed; top: 0; left: 0; right: 0; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between;
        padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px 14px; background: linear-gradient(var(--panel), transparent); z-index: 10; pointer-events: none; }
      .top > * { pointer-events: auto; }
      .brand { display: flex; align-items: baseline; gap: 10px; }
      .brand .name { font: 700 22px var(--display); letter-spacing: .02em; }
      .brand .tag { font: 500 11px var(--label); letter-spacing: .22em; text-transform: uppercase; color: var(--dim); }
      .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; background: rgba(0,0,0,.35); }
      .seg button { background: none; border: 0; padding: 8px 14px; font: 500 13px var(--label); letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
      .seg button.on { background: var(--cream); color: var(--ink); }

      .floors { position: fixed; right: 16px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 4px; z-index: 10; }
      .floors button { display: flex; justify-content: space-between; gap: 12px; min-width: 104px; padding: 7px 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 3px;
        font: 500 12px var(--label); letter-spacing: .16em; text-transform: uppercase; font-variant-numeric: tabular-nums; }
      .floors button span { color: var(--sodium); }
      .floors button.on { border-color: var(--sodium); }

      .foot { position: fixed; left: 0; right: 0; bottom: 0; padding: 18px 16px calc(env(safe-area-inset-bottom, 0px) + 16px); background: linear-gradient(transparent, var(--panel) 40%); z-index: 10; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
      .foot > * { pointer-events: auto; }
      .foot .blurb { margin: 0; max-width: 60ch; font: 400 17px/1.45 var(--display); }
      .foot .row, .card .row { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
      .foot button, .card button { background: rgba(0,0,0,.35); border: 1px solid var(--line); border-radius: 3px; padding: 9px 14px; font: 500 13px var(--label); letter-spacing: .14em; text-transform: uppercase; }
      .foot button.primary, .card button.primary { background: var(--sodium); border-color: var(--sodium); color: var(--ink); }
      .hint { color: var(--dim); font-size: 13px; }
      .where { font: 500 13px var(--label); letter-spacing: .16em; }
      .where i { font-style: normal; color: var(--dim); margin-left: 6px; }
      .foot.walk { padding-left: 16px; }
      .near { align-self: flex-start; text-transform: none !important; letter-spacing: 0 !important; font: 400 16px var(--display) !important; }
      .near b { font: 500 13px var(--label); letter-spacing: .14em; text-transform: uppercase; margin-right: 6px; }
      .near span { color: var(--sodium); margin-left: 6px; font-variant-numeric: tabular-nums; }

      .stick { position: fixed; left: 24px; bottom: calc(env(safe-area-inset-bottom, 0px) + 120px); width: 96px; height: 96px; border-radius: 50%; border: 1.5px solid rgba(239,228,204,.4); z-index: 12; touch-action: none; }
      .stick .nub { position: absolute; left: 30px; top: 30px; width: 36px; height: 36px; border-radius: 50%; background: rgba(239,228,204,.45); }

      .card { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(420px, calc(100vw - 32px)); box-sizing: border-box; padding: 20px 20px 18px;
        background: #efe6d2; color: #1d1a16; border-radius: 2px; box-shadow: 0 20px 60px rgba(0,0,0,.6); z-index: 20; }
      .card .num { display: inline-block; padding: 4px 12px; background: linear-gradient(#d9b871, #a9843f 55%, #7c5f2a); color: #2a1d08; font: 600 26px var(--display); border-radius: 2px; }
      .card h2 { margin: 12px 0 4px; font: 700 28px/1.15 var(--display); text-wrap: balance; }
      .card .meta { margin: 0 0 16px; color: #5b5348; font-size: 14px; font-variant-numeric: tabular-nums; }
      .card button { color: #1d1a16; background: transparent; border-color: rgba(29,26,22,.3); }
      .card button.primary { color: #1d1a16; }
      .card .x { position: absolute; right: 12px; top: 12px; padding: 5px 9px; font-size: 11px; }
      .card .link { color: #7a2a1e; font-size: 14px; }

      @media (max-width: 560px) {
        .brand .tag { display: none; }
        .floors { top: calc(env(safe-area-inset-top, 0px) + 70px); transform: none; }
        .floors button { min-width: 88px; padding: 6px 8px; font-size: 11px; }
        .foot .blurb { font-size: 15px; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot">Checking you in</div>
    <script type="module" src="/src/building/main.jsx"></script>
  </body>
</html>
