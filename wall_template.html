<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Vault</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Caveat:wght@400;600;700&family=Schibsted+Grotesk:ital,wght@0,400;0,500;0,700;1,400&display=swap');
:root{--wall:#E8E2D6;--wall2:#DCD4C4;--ink:#1C1914;--mid:#6E675A;--rule:#D2C9B8;--photo:#FFFEF8;--pencil:#8A8272;--pen:#25221C;--thread:#FFF3D6}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:radial-gradient(1400px 900px at 30% 10%,var(--wall) 0%,var(--wall2) 70%,#D4CBB9 100%);color:var(--ink);font-family:'Schibsted Grotesk',sans-serif;font-size:15px;line-height:1.6}

/* ============ the room ============ */
#viewport{position:fixed;inset:0;overflow:hidden;cursor:grab;touch-action:none}
#viewport.panning{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#world.glide{transition:transform .85s cubic-bezier(.22,.9,.24,1)}
#source{display:none}

/* wall regions: three rooms on one plane */
.region{position:absolute;border-radius:26px;pointer-events:none}
#regBox{background:rgba(120,100,70,.07);box-shadow:inset 0 0 0 1px rgba(110,103,90,.14)}
#regHazy{background:linear-gradient(170deg,rgba(26,23,17,.82),rgba(35,31,23,.78));box-shadow:inset 0 0 0 1px rgba(0,0,0,.3)}

/* painted-on-the-wall text */
.wtx{position:absolute;pointer-events:none}
.wtx .over{font-size:13px;font-weight:700;letter-spacing:.34em;text-transform:uppercase;color:var(--mid);margin-bottom:26px}
.wtx h1{font-family:'Instrument Serif',serif;font-weight:400;font-style:italic;font-size:150px;line-height:.92;color:var(--ink)}
.wtx .dek{max-width:56ch;margin-top:30px;font-size:17px;line-height:1.65}
.wtx .dek em{font-family:'Caveat',cursive;font-style:normal;font-size:25px;font-weight:600}
.wtx .facts{font-size:13.5px;color:var(--mid);margin-top:20px;max-width:80ch}
.wtx .facts b{font-weight:700;color:var(--ink)}
.bandhead{position:absolute;pointer-events:none;white-space:nowrap}
.bandhead h2{font-family:'Caveat',cursive;font-weight:700;font-size:54px;line-height:1;color:var(--pen);display:inline}
.bandhead span{font-family:'Caveat',cursive;font-size:24px;color:var(--mid);margin-left:16px}
.roomhead{position:absolute;pointer-events:none}
.roomhead h2{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;font-size:64px;color:var(--ink)}
.roomhead.dark h2{color:#B7AE9C}
.roomhead p{font-family:'Caveat',cursive;font-size:23px;color:var(--mid);margin-top:4px}
.roomhead.dark p{color:#7E776A}
.colo{position:absolute;pointer-events:none;max-width:620px}
.colo .prod{font-size:12px;font-weight:700;letter-spacing:.24em;text-transform:uppercase}
.colo .line{font-family:'Caveat',cursive;font-size:27px;font-weight:600;margin-top:10px;color:var(--pen)}
.colo .fn{font-size:12.5px;color:var(--mid);margin-top:16px}
.colo .fn b{color:var(--ink);font-weight:500}

/* ============ one photo ============ */
.photo{position:absolute;width:264px;height:324px;cursor:pointer;transition:left .7s cubic-bezier(.3,.8,.3,1),top .7s cubic-bezier(.3,.8,.3,1),transform .7s cubic-bezier(.3,.8,.3,1),opacity .45s;transform:rotate(var(--rot,0deg))}
.photo:hover{z-index:40}
.photo.flipped{z-index:60}
body.noanim .photo{transition:none !important}
body.mode-wall .photo:hover,body.mode-backs .photo:hover{transform:rotate(0deg) translateY(-4px)}
.photo.dim{opacity:.16;pointer-events:none}
.photo.lit{z-index:35}
.photo.lit .card{box-shadow:0 10px 26px rgba(28,25,20,.3),0 0 0 3px rgba(255,243,214,.9),0 0 26px 4px rgba(255,236,190,.55)}
/* tape */
.photo::before{content:'';position:absolute;top:-13px;left:50%;width:96px;height:27px;transform:translateX(-50%) rotate(-2.2deg);background:linear-gradient(100deg,rgba(244,238,218,.62),rgba(238,230,206,.5));box-shadow:0 1px 3px rgba(28,25,20,.14);z-index:5}
.photo:nth-child(3n)::before{transform:translateX(-50%) rotate(1.8deg)}
.card{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.35,.7,.3,1);box-shadow:0 18px 34px rgba(28,25,20,.26),0 4px 10px rgba(28,25,20,.16);background:var(--photo);border-radius:2px}
.photo.flipped .card{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--photo);border-radius:2px}
.face.back{transform:rotateY(180deg);overflow:hidden}
/* slight corner curl on the print */
.face.front::after{content:'';position:absolute;right:0;bottom:0;width:34px;height:34px;background:linear-gradient(315deg,rgba(28,25,20,.10),rgba(28,25,20,0) 55%);border-radius:0 0 2px 0}

/* the image field */
.img{position:absolute;top:14px;left:14px;width:236px;height:236px;background:var(--bg);color:var(--fg);overflow:hidden}
.img::before{content:var(--glyph);position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:96px;line-height:1;color:var(--sub);opacity:.55;font-family:'Schibsted Grotesk',sans-serif}
.img::after{content:'';position:absolute;inset:0;background:linear-gradient(118deg,rgba(255,255,255,.14) 0%,rgba(255,255,255,0) 34%),radial-gradient(120% 90% at 50% 108%,rgba(0,0,0,.12),rgba(0,0,0,0) 55%)}
.photo .img{transition:filter .9s ease}
.photo.undev .img{filter:brightness(.16) saturate(.05) contrast(.75)}

/* the chin: handwriting on the border */
.chin{position:absolute;left:15px;right:15px;bottom:8px;height:62px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;color:var(--pen)}
.cfilm{font-family:'Caveat',cursive;font-weight:600;font-size:21px;line-height:.98;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cfilm span{font-size:15px;color:var(--pencil);margin-left:5px}
.cscore{font-family:'Caveat',cursive;font-weight:700;font-size:27px;white-space:nowrap}
.cscore small{font-size:14px;color:var(--pencil);font-weight:400}
.cscore .cmode{display:block;font-size:12.5px;color:var(--pencil);font-weight:400;line-height:.9;text-align:right}
.rank{position:absolute;top:16px;left:17px;z-index:4;font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--pencil);background:rgba(255,254,248,.82);padding:2px 7px;border-radius:3px}

/* state: the shoebox (scored from memory, in pencil) */
.photo.st-arc .img{filter:saturate(.3) contrast(.9) brightness(1.08)}
.photo.st-arc.undev .img{filter:brightness(.16) saturate(.05) contrast(.75)}
.photo.st-arc .cfilm,.photo.st-arc .cscore{color:var(--pencil)}
/* state: hazy, the chemicals never finished */
.photo.st-hazy .img{background:linear-gradient(160deg,#23211B 0%,#2E2B23 55%,#26241D 100%);color:#4A463C}
.photo.st-hazy .img::before{opacity:.18;color:#8A8272}
.photo.st-hazy .cfilm{color:var(--pencil)}
.photo.st-hazy .cscore{font-size:15px;color:var(--pencil);font-weight:400}
/* state: certified. pen over the pencil, color comes back */
.photo.st-cert .img{filter:none}
.photo.st-cert .cfilm,.photo.st-cert .cscore{color:var(--pen)}

/* ============ the back of the photo ============ */
.backscale{width:660px;height:810px;transform:scale(.4);transform-origin:0 0;overflow-y:auto;overflow-x:hidden;padding:34px 38px 40px;color:var(--pen);background:var(--photo)}
.backscale::-webkit-scrollbar{width:10px}
.backscale::-webkit-scrollbar-thumb{background:var(--rule);border-radius:5px}
.backscale section.panel{background:none !important;color:var(--pen);filter:none !important;display:block}
.backscale .no{font-size:11px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--pencil)}
.backscale .head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-top:8px}
.backscale .film{font-family:'Instrument Serif',serif;font-size:37px;line-height:1.02;color:var(--pen)}
.backscale .film span{font-family:'Schibsted Grotesk';font-size:13px;color:var(--pencil);margin-left:7px}
.backscale .score{font-family:'Instrument Serif',serif;font-size:37px;color:var(--pen);white-space:nowrap}
.backscale .score small{font-size:14px;color:var(--pencil)}
.backscale .meta{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--pencil);margin-top:9px}
.backscale .plot{margin-top:16px;max-width:58ch;font-size:14.5px}
.backscale .quote{font-family:'Instrument Serif',serif;font-style:italic;font-size:22px;line-height:1.3;margin-top:18px;max-width:36ch}
.backscale .quote::before{content:'what you said, verbatim';display:block;font-family:'Caveat',cursive;font-size:16px;font-style:normal;color:var(--pencil);margin-bottom:2px}
.backscale .more-toggle{display:inline-block;font-family:'Caveat',cursive;font-size:17px;font-weight:600;margin-top:13px;cursor:pointer;user-select:none;opacity:.85;border-bottom:1px dashed currentColor;padding-bottom:1px}
.backscale .more{display:none;margin-top:8px}
.backscale .more.open{display:block}
.backscale .mq{font-family:'Instrument Serif',serif;font-style:italic;font-size:16.5px;line-height:1.4;margin-top:12px;max-width:52ch}
.backscale .mq b{font-family:'Caveat',cursive;font-style:normal;font-weight:600;font-size:15px;color:var(--pencil);display:block}
.backscale .debrief{margin-top:16px;color:#57503F;font-size:13.5px;max-width:58ch}
.backscale .debrief b{font-weight:500;color:var(--pen)}
.backscale .certnote{font-family:'Instrument Serif',serif;font-style:italic;font-size:20px;line-height:1.35;margin-top:16px;max-width:38ch}
.backscale .certnote b{display:block;font-family:'Caveat',cursive;font-style:normal;font-weight:600;font-size:15px;color:var(--pencil)}

/* see also, in the handwriting */
.seealso{margin-top:22px;border-top:1px dotted var(--rule);padding-top:14px}
.seealso .sahead{font-family:'Caveat',cursive;font-size:19px;font-weight:600;color:var(--pencil)}
.saline{margin-top:11px;font-family:'Caveat',cursive;font-size:20px;line-height:1.28;color:var(--pen)}
.saline .rel{display:inline-block;font-size:14px;color:var(--pencil);letter-spacing:.04em;margin-right:7px}
.saline .goto{font-weight:700;text-decoration:underline;text-decoration-style:wavy;text-decoration-thickness:1px;text-underline-offset:4px;cursor:pointer}
.saline .goto:hover{color:#6B4A2E}
.saline .nopho{font-weight:600;color:var(--pencil)}
.saline .nopho::after{content:' (no photo yet)';font-size:14px}

/* certification form (on the back) */
.certwrap{margin-top:14px;padding-top:12px;border-top:1px dotted var(--rule)}
.cert-btn{display:inline-block;font-family:'Caveat',cursive;font-size:18px;font-weight:600;cursor:pointer;color:var(--mid);border:1px solid var(--rule);border-radius:999px;padding:4px 15px;background:var(--photo);user-select:none}
.cert-btn:hover{border-color:var(--ink);color:var(--ink)}
.certform{display:none;margin-top:10px;gap:8px;flex-wrap:wrap;align-items:center}
.certwrap.open .certform{display:flex}
.certwrap.open .cert-btn{display:none}
.certform input{font-family:'Schibsted Grotesk',sans-serif;font-size:14px;padding:9px 12px;border:1px solid var(--rule);border-radius:8px;background:#fff;color:var(--ink)}
.certform input:focus{outline:none;border-color:var(--ink)}
.cert-score{width:80px;text-align:center;font-weight:700}
.cert-why{flex:1;min-width:220px}
.certform input.bad{border-color:#B4432E;background:#FDF1EE}
.cert-go{font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;background:var(--ink);color:var(--photo);border-radius:999px;padding:9px 15px;cursor:pointer;user-select:none}
.certdone{display:none;font-family:'Caveat',cursive;font-size:17px;color:var(--mid)}
.certwrap.done .cert-btn,.certwrap.done .certform{display:none}
.certwrap.done .certdone{display:inline}
.certdone b{font-weight:700;color:var(--pen)}
.certdone u{cursor:pointer;text-underline-offset:3px}
.photo.st-hazy .certwrap{display:none}

/* ============ threads (opt-in, temporary, never yarn) ============ */
#threads{position:absolute;left:0;top:0;pointer-events:none;overflow:visible;z-index:30}
#threads line{stroke:#C42B2B;stroke-linecap:round;filter:drop-shadow(0 0 4px rgba(214,58,48,.95)) drop-shadow(0 0 14px rgba(196,43,43,.5));transition:opacity .18s}
#threads line.fadeout{opacity:0 !important}
body.holding .photo:not(.lit){opacity:.32;transition:opacity .25s}
body.holding .wtx,body.holding .bandhead,body.holding .roomhead,body.holding .colo{opacity:.14;transition:opacity .25s}

/* constellation labels */
.constlabel{position:absolute;pointer-events:none;font-family:'Caveat',cursive;font-weight:700;font-size:36px;color:var(--pen);opacity:.9;white-space:nowrap;transform:translate(-50%,-50%)}
body.mode-const .wtx,body.mode-const .bandhead,body.mode-const .roomhead,body.mode-const .colo{opacity:.12}
body.mode-const .region{opacity:.25}
.photo.dim{opacity:.08 !important}

/* ============ the desk (fixed chrome) ============ */
#desk{position:fixed;left:0;right:0;top:0;z-index:80;display:flex;align-items:center;gap:10px;padding:10px 16px;background:linear-gradient(180deg,rgba(232,226,214,.97),rgba(232,226,214,.86) 70%,rgba(232,226,214,0));pointer-events:none;flex-wrap:wrap}
#desk .brand{font-family:'Instrument Serif',serif;font-style:italic;font-size:21px;margin-right:6px}
.chips{display:flex;gap:7px;align-items:center;pointer-events:auto;flex-wrap:wrap}
.dl{font-size:9px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--mid);margin:0 2px 0 10px}
.opt{font-size:11.5px;font-weight:500;padding:6px 14px;border:1px solid var(--rule);border-radius:999px;background:var(--photo);cursor:pointer;user-select:none;white-space:nowrap;transition:.12s;color:var(--mid)}
.opt:hover{color:var(--ink);border-color:var(--mid)}
.opt.on{background:var(--ink);color:var(--photo);border-color:var(--ink)}
#tally{position:fixed;left:18px;bottom:14px;z-index:80;font-family:'Caveat',cursive;font-size:18px;color:var(--mid);pointer-events:none;max-width:46vw}
#hint{position:fixed;right:18px;bottom:14px;z-index:80;font-family:'Caveat',cursive;font-size:17px;color:var(--mid);pointer-events:none;text-align:right}
#offwall{position:fixed;top:64px;right:18px;z-index:85;display:none;font-family:'Caveat',cursive;font-size:18px;font-weight:600;padding:6px 16px;background:var(--pen);color:var(--photo);border-radius:999px;cursor:pointer;user-select:none}
body.dived #offwall{display:block}
body.dived #tally,body.dived #hint{display:none}

/* ============ the pocket: pending certifications ============ */
#tray{position:fixed;left:0;right:0;bottom:0;z-index:90;background:var(--pen);color:var(--photo);padding:13px 20px 15px;display:none}
#tray.on{display:block}
.trayin{max-width:1040px;margin:0 auto}
.traybar{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.traybar .t{font-size:12px;line-height:1.45;flex:1;min-width:190px;opacity:.85}
.tbtn{font-size:9.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;border:1px solid rgba(255,254,248,.42);border-radius:999px;padding:8px 14px;cursor:pointer;user-select:none;white-space:nowrap}
.tbtn.solid{background:var(--photo);color:var(--pen);border-color:var(--photo)}
#traycode{display:none;width:100%;margin-top:11px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;line-height:1.55;padding:11px;border-radius:9px;border:none;height:96px;background:#37332A;color:#EFEBE0;resize:vertical}
#traycode.on{display:block}

/* the ledger palettes: the photo is the film */
/* ledger palettes: start */
__PALETTES__
/* ledger palettes: end */
.memento::before{opacity:.05}

@media (prefers-reduced-motion: reduce){
  .photo,.card,#world.glide{transition:none !important}
  .photo .img{transition:none !important}
}
</style>
</head>
<body class="mode-wall">

<div id="source">

__SECTIONS__

</div>

<div id="viewport"><div id="world">
  <svg id="threads"></svg>
</div></div>

<div id="desk">
  <span class="brand">The Vault</span>
  <div class="chips">
    <span class="dl">Mode</span>
    <span class="opt on" data-mode="wall">The Wall</span>
    <span class="opt" data-mode="backs">The Backs</span>
    <span class="opt" data-mode="const">Constellations</span>
    <span class="opt" data-mode="thread">The Thread</span>
    <span class="dl">Go to</span>
    <span class="opt" data-go="def">The wall</span>
    <span class="opt" data-go="box">The shoebox</span>
    <span class="opt" data-go="hazy">The hazy wing</span>
    <span class="opt" data-go="all">Everything</span>
  </div>
</div>

<div id="offwall">back on the wall</div>
<div id="tally"></div>
<div id="hint"></div>

<div id="tray"><div class="trayin">
  <div class="traybar">
    <span class="t" id="traycount"></span>
    <span class="tbtn solid" id="traycopy">Copy for Leonard</span>
    <span class="tbtn" id="trayshow">Show</span>
    <span class="tbtn" id="trayclear">Clear</span>
  </div>
  <textarea id="traycode" readonly></textarea>
</div></div>

<script>
'use strict';
var META = __META__;
var LINKS = __LINKS__;
var FACTS_HTML = __FACTS_JS__;

/* ---------- geometry ---------- */
var PW = 264, PH = 324;          /* one photo */
var PX = 312, PY = 404;          /* wall pitch */
var DEF_COLS = 6, BOX_COLS = 6, HAZY_COLS = 5;
var BANDS = [
  [10.0, 10.0, 'The Crown', 'the perfect scores'],
  [9.0, 9.99, 'The Nines', 'the podium, extremely crowded'],
  [8.0, 8.99, 'The Eights', 'the honest middle'],
  [7.0, 7.99, 'The Sevens', 'liked it, itemized the bill'],
  [0, 6.99, 'The Floor', 'and below']
];

var world = document.getElementById('world');
var viewport = document.getElementById('viewport');
var threads = document.getElementById('threads');
var stray = [];   /* wall-text elements rebuilt each layout */

/* deterministic tiny jitter from a string */
function hash(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=(h*16777619)>>>0}return h}
function jit(key, span){return ((hash(key)%1000)/1000-.5)*span}

/* ---------- build photos from the panel source ---------- */
var photos = [];
var byTitle = {};

function buildPhotos(){
  var secs = [].slice.call(document.querySelectorAll('#source section.panel'));
  secs.forEach(function(sec, i){
    var classes = sec.className.split(/\s+/);
    var slug = (sec.dataset.set === 'ledger') ? classes[1] : null;
    var state = sec.dataset.hazy ? 'hazy'
              : sec.dataset.set === 'ledger' ? 'ledger'
              : sec.dataset.cert === '1' ? 'cert' : 'arc';
    var title = sec.dataset.title || (slug && META[slug] ? META[slug][2] : '?');
    var ysp = sec.querySelector('.film span');
    var year = ysp ? ysp.textContent : '';
    var score = parseFloat(sec.dataset.score);

    var el = document.createElement('div');
    el.className = 'photo st-' + state;
    el.dataset.key = title;
    if (slug) el.dataset.slug = slug;
    el.style.setProperty('--rot', (jit(title, 3.4)).toFixed(2) + 'deg');

    var rank = document.createElement('div'); rank.className = 'rank';
    var card = document.createElement('div'); card.className = 'card';
    var front = document.createElement('div'); front.className = 'face front';
    var img = document.createElement('div'); img.className = 'img';
    if (slug) img.classList.add(slug);
    else if (sec.getAttribute('style')) img.style.cssText = sec.getAttribute('style');
    var chin = document.createElement('div'); chin.className = 'chin';
    var cf = document.createElement('div'); cf.className = 'cfilm';
    cf.innerHTML = title + (year ? ' <span>' + year + '</span>' : '');
    var cs = document.createElement('div'); cs.className = 'cscore';
    chin.appendChild(cf); chin.appendChild(cs);
    front.appendChild(img); front.appendChild(chin);

    var back = document.createElement('div'); back.className = 'face back';
    var bs = document.createElement('div'); bs.className = 'backscale';
    bs.appendChild(sec);            /* the hand-authored panel IS the back */
    back.appendChild(bs);
    card.appendChild(front); card.appendChild(back);
    el.appendChild(rank); el.appendChild(card);
    world.appendChild(el);

    var p = {el: el, sec: sec, img: img, chinScore: cs, rankEl: rank,
             key: title, slug: slug, state: state, score: score,
             rec: parseInt(sec.dataset.rec || '0', 10),
             sort: sec.dataset.sort || title.toLowerCase(),
             home: {x: 0, y: 0}};
    photos.push(p);
    byTitle[title] = p;
    paintChin(p);
  });
}

function paintChin(p){
  if (p.state === 'hazy'){ p.chinScore.textContent = 'undeveloped'; return; }
  var mode = p.state === 'arc' ? 'from memory' : p.state === 'cert' ? 'in pen' : '';
  p.chinScore.innerHTML = p.score.toFixed(1) + '<small> /10</small>' +
    (mode ? '<span class="cmode">' + mode + '</span>' : '');
}

/* ---------- the links layer ---------- */
var adj = {};      /* title -> [{kin, weight, relation}] undirected, on-wall only */
function resolveLinks(){
  LINKS.forEach(function(l){
    if (byTitle[l.from] && byTitle[l.to]){
      (adj[l.from] = adj[l.from] || []).push({kin: l.to, weight: l.weight, relation: l.relation});
      (adj[l.to] = adj[l.to] || []).push({kin: l.from, weight: l.weight, relation: l.relation});
    }
  });
  /* see-also lines on the back, in the handwriting */
  photos.forEach(function(p){
    var mine = LINKS.filter(function(l){
      return l.from === p.key || (!l.directional && l.to === p.key);
    });
    if (!mine.length) return;
    var sa = document.createElement('div'); sa.className = 'seealso';
    sa.innerHTML = '<div class="sahead">see also, in the handwriting</div>';
    mine.forEach(function(l){
      var kin = l.from === p.key ? l.to : l.from;
      var line = document.createElement('div'); line.className = 'saline';
      var kinEl = byTitle[kin]
        ? '<span class="goto" data-goto="' + kin.replace(/"/g, '&quot;') + '">' + kin + '</span>'
        : '<span class="nopho">' + kin + '</span>';
      line.innerHTML = '<span class="rel">' + l.relation.replace(/-/g, ' ') + '</span> ' +
        kinEl + '. <span class="nt">' + l.note + '</span>';
      sa.appendChild(line);
    });
    p.el.querySelector('.backscale').appendChild(sa);
  });
}

/* ---------- layout: the ranked wall ---------- */
var HDR = {x: 70, y: 60};
var DEF0 = {x: 70, y: 560};
var regions = {};

function clearWallText(){ stray.forEach(function(e){ e.remove(); }); stray = []; }
function wallText(cls, x, y, html){
  var d = document.createElement('div');
  d.className = cls; d.style.left = x + 'px'; d.style.top = y + 'px';
  d.innerHTML = html; world.appendChild(d); stray.push(d);
  return d;
}

function defSet(){
  return photos.filter(function(p){ return p.state === 'ledger' || p.state === 'cert'; })
    .sort(function(a, b){ return b.score - a.score || (a.sort < b.sort ? -1 : 1); });
}

function layout(){
  clearWallText();
  wallText('wtx', HDR.x, HDR.y,
    '<div class="over">Movie Nights &middot; An External Memory System &middot; Since July 13, 2026</div>' +
    '<h1>The Vault</h1>' +
    '<p class="dek"><em>The condition is real, so the system is real:</em> neither of us trusts a memory older than the night it was made. A film gets its photo taken in the room, reaction first, number second, and goes on the wall. The shoebox holds the prints memory swears it took earlier. The dark frames never developed, and only a rewatch finishes the chemicals. If it isn\'t written on a photo, it didn\'t happen.</p>' +
    '<p class="facts">' + FACTS_HTML + '</p>');

  /* definitive wall: tier bands */
  var defs = defSet();
  var y = DEF0.y, maxX = 0;
  var i = 0;
  /* ranks with ties */
  var k = 0;
  while (k < defs.length){
    var v = defs[k].score, j = k;
    while (j < defs.length && defs[j].score === v) j++;
    for (var q = k; q < j; q++)
      defs[q].rankTxt = (j - k > 1 ? 'T-' + (k + 1) : 'No. ' + (k + 1));
    k = j;
  }
  BANDS.forEach(function(b){
    var inb = defs.filter(function(p){ return p.score >= b[0] && p.score <= b[1]; });
    if (!inb.length) return;
    wallText('bandhead', DEF0.x + 6, y, '<h2>' + b[2] + '</h2><span>' + b[3] + '</span>');
    y += 96;
    inb.forEach(function(p, n){
      var col = n % DEF_COLS, row = Math.floor(n / DEF_COLS);
      place(p, DEF0.x + col * PX + jit(p.key + 'x', 14),
               y + row * PY + jit(p.key + 'y', 16));
      p.rankEl.textContent = p.rankTxt;
      p.sec.querySelector('.no').textContent = p.rankTxt;
      maxX = Math.max(maxX, DEF0.x + col * PX + PW);
    });
    y += Math.ceil(inb.length / DEF_COLS) * PY + 40;
  });
  var defBottom = y;
  regions.def = {x: HDR.x - 40, y: HDR.y - 40, w: DEF_COLS * PX + 120, h: defBottom - HDR.y + 60};

  /* colophon painted under the definitive wall */
  wallText('colo', DEF0.x + 6, defBottom + 30,
    '<div class="prod">A Leonard &amp; Lou Production</div>' +
    '<div class="line">the ledger remembers what we can\'t</div>' +
    '<p class="fn"><b>How a film gets certified:</b> flip its photo, write on it in pen: a fresh number and one line, and the line becomes its review. That is the whole toll. A rewatch always overrides a certification, and every rewatch of an archive film produces a paired measurement, memory against live. When there are enough to state a real number, I will state it and touch nothing.</p>');

  /* the shoebox */
  var BOX0 = {x: DEF0.x + DEF_COLS * PX + 460, y: 560};
  var arcs = photos.filter(function(p){ return p.state === 'arc'; })
    .sort(function(a, b){ return b.score - a.score || (a.sort < b.sort ? -1 : 1); });
  wallText('roomhead', BOX0.x + 6, BOX0.y - 210,
    '<h2>The Shoebox</h2><p>prints memory swears it took. scores in pencil, quotes earned live only.</p>');
  arcs.forEach(function(p, n){
    var col = n % BOX_COLS, row = Math.floor(n / BOX_COLS);
    place(p, BOX0.x + col * PX + jit(p.key + 'x', 14),
             BOX0.y + row * PY + jit(p.key + 'y', 16));
    p.rankEl.textContent = 'memory ' + (n + 1);
    p.sec.querySelector('.no').textContent = 'memory No. ' + (n + 1);
  });
  var boxRows = Math.ceil(arcs.length / BOX_COLS);
  regions.box = {x: BOX0.x - 60, y: BOX0.y - 250, w: BOX_COLS * PX + 130, h: boxRows * PY + 340};
  sizeRegion('regBox', regions.box);

  /* the hazy wing */
  var HZ0 = {x: BOX0.x + BOX_COLS * PX + 480, y: 560};
  var hz = photos.filter(function(p){ return p.state === 'hazy'; })
    .sort(function(a, b){ return a.sort < b.sort ? -1 : 1; });
  wallText('roomhead dark', HZ0.x + 6, HZ0.y - 210,
    '<h2>The Hazy Wing</h2><p>seen, too faded to rate. the chemicals never finished; a rewatch is the bath.</p>');
  hz.forEach(function(p, n){
    var col = n % HAZY_COLS, row = Math.floor(n / HAZY_COLS);
    place(p, HZ0.x + col * PX + jit(p.key + 'x', 14),
             HZ0.y + row * PY + jit(p.key + 'y', 16));
    p.rankEl.textContent = 'undeveloped';
    p.sec.querySelector('.no').textContent = 'undeveloped';
  });
  var hzRows = Math.ceil(hz.length / HAZY_COLS);
  regions.hazy = {x: HZ0.x - 60, y: HZ0.y - 250, w: HAZY_COLS * PX + 130, h: hzRows * PY + 340};
  sizeRegion('regHazy', regions.hazy);

  /* world extent */
  var W = regions.hazy.x + regions.hazy.w + 200;
  var H = Math.max(regions.def.y + regions.def.h, regions.box.y + regions.box.h,
                   regions.hazy.y + regions.hazy.h) + 200;
  world.style.width = W + 'px'; world.style.height = H + 'px';
  threads.setAttribute('width', W); threads.setAttribute('height', H);
  threads.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  regions.all = {x: 0, y: 0, w: W, h: H};
  tally();
}

function place(p, x, y){

}

function sizeRegion(id, r){
  var el = document.getElementById(id);
  if (!el){ el = document.createElement('div'); el.className = 'region'; el.id = id;
    world.insertBefore(el, world.firstChild); }

function tally(){
  var defs = defSet();
  var avg = defs.length ? defs.reduce(function(a, p){ return a + p.score; }, 0) / defs.length : 0;
  var np = Object.keys(pending).length;
  var arcsN = photos.filter(function(p){ return p.state === 'arc'; }).length;
  var hazyN = photos.filter(function(p){ return p.state === 'hazy'; }).length;
  document.getElementById('tally').textContent =
    'The definitive list: ' + defs.length + ' films, average ' + avg.toFixed(2) + '. ' +
    (np ? np + ' still pending, waiting on a paste to Leonard. '
        : 'It grows two ways: we watch something new, or you certify something old. ') +
    arcsN + ' in the shoebox, ' + hazyN + ' undeveloped.';

/* ---------- camera ---------- */
var cam = {x: 0, y: 0, s: 1};
function setCam(){ world.style.transform = 'translate(' + cam.x + 'px,' + cam.y + 'px) scale(' + cam.s + ')'; }
function vw(){ return viewport.clientWidth; }
function vh(){ return viewport.clientHeight; }
function clampS(s){ return Math.max(.05, Math.min(3, s)); }

function glideTo(x, y, s){
  world.classList.add('glide');
  cam.x = x; cam.y = y; cam.s = s; setCam();
}
world.addEventListener('transitionend', function(e){
  if (e.propertyName === 'transform') world.classList.remove('glide');
});

function DESK_H(){ var d = document.getElementById('desk'); return (d ? d.offsetHeight : 56) + 6; }
function fitRect(r, pad){
  pad = pad || 60;
  var dh = DESK_H();
  var s = clampS(Math.min(vw() / (r.w + pad * 2), (vh() - dh) / (r.h + pad * 2)));
  var x = (vw() - r.w * s) / 2 - r.x * s;
  var y = dh + (vh() - dh - r.h * s) / 2 - r.y * s;
  glideTo(x, y, s);
}
function centerPhoto(p, s){
  var dh = DESK_H();
  var x = vw() / 2 - (p.home.x + PW / 2) * s;
  var y = dh + (vh() - dh) / 2 - (p.home.y + PH / 2) * s;
  glideTo(x, y, s);
}

/* pan + zoom + pinch */
var pointers = {};
var panState = null, moved = false, pinch0 = null;

viewport.addEventListener('pointerdown', function(e){
  pointers[e.pointerId] = {x: e.clientX, y: e.clientY};
  var keys = Object.keys(pointers);
  world.classList.remove('glide');
  if (keys.length === 1){
    panState = {px: e.clientX, py: e.clientY, cx: cam.x, cy: cam.y};
    moved = false;
    maybeStartHold(e);
  } else if (keys.length === 2){
    cancelHold();
    var a = pointers[keys[0]], b = pointers[keys[1]];
    pinch0 = {d: Math.hypot(a.x - b.x, a.y - b.y), s: cam.s,
              mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2, cx: cam.x, cy: cam.y};
    panState = null;
  }
  viewport.setPointerCapture(e.pointerId);
});
viewport.addEventListener('pointermove', function(e){
  if (!pointers[e.pointerId]) return;
  pointers[e.pointerId] = {x: e.clientX, y: e.clientY};
  var keys = Object.keys(pointers);
  if (pinch0 && keys.length === 2){
    var a = pointers[keys[0]], b = pointers[keys[1]];
    var d = Math.hypot(a.x - b.x, a.y - b.y);
    var s2 = clampS(pinch0.s * d / pinch0.d);
    var mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    cam.s = s2;
    cam.x = mx - (pinch0.mx - pinch0.cx) * (s2 / pinch0.s);
    cam.y = my - (pinch0.my - pinch0.cy) * (s2 / pinch0.s);
    setCam();
    return;
  }
  if (panState){
    var dx = e.clientX - panState.px, dy = e.clientY - panState.py;
    if (!moved && Math.hypot(dx, dy) > 6){ moved = true; cancelHold(); viewport.classList.add('panning'); }
    if (moved){ cam.x = panState.cx + dx; cam.y = panState.cy + dy; setCam(); }
  }
});
function endPointer(e){
  delete pointers[e.pointerId];
  if (Object.keys(pointers).length < 2) pinch0 = null;
  if (!Object.keys(pointers).length){
    viewport.classList.remove('panning');
    releaseHold();
    panState = null;
  }
}
viewport.addEventListener('pointerup', endPointer);
viewport.addEventListener('pointercancel', endPointer);

/* until the first real interaction, keep the wall fitted on resize */
var interacted = false;
viewport.addEventListener('pointerdown', function(){ interacted = true; });
viewport.addEventListener('wheel', function(){ interacted = true; });
window.addEventListener('resize', function(){
  if (!interacted && !document.body.classList.contains('dived')){
    fitRect(regions.def, 40);
    world.classList.remove('glide'); setCam();
  }
});

viewport.addEventListener('wheel', function(e){
  /* reading a flipped back while dived: let it scroll */
  var bs = e.target.closest && e.target.closest('.photo.flipped .backscale');
  if (bs && document.body.classList.contains('dived')) return;
  e.preventDefault();
  world.classList.remove('glide');
  var f = Math.exp(-e.deltaY * 0.0016);
  var s2 = clampS(cam.s * f);
  cam.x = e.clientX - (e.clientX - cam.x) * (s2 / cam.s);
  cam.y = e.clientY - (e.clientY - cam.y) * (s2 / cam.s);
  cam.s = s2; setCam();
}, {passive: false});

/* ---------- modes ---------- */
var state = {mode: 'wall'};
var MODE_HINT = {
  wall: 'drag to roam, scroll to zoom, click a photo to step close',
  backs: 'click a photo to flip it and read the back. the handwriting flies you to its kin',
  const: 'links became distance. the wall reflows; step back and read the regions',
  thread: 'hold a photo. the light finds its kin. let go and it\'s gone'
};
function setMode(m){
  if (state.mode === m) return;
  if (document.body.classList.contains('dived')) closeDive(true);
  if (state.mode === 'const') exitConst();
  state.mode = m;
  document.body.className = document.body.className.replace(/mode-\S+/, 'mode-' + m) +
    (document.body.className.indexOf('mode-') < 0 ? ' mode-' + m : '');
  if (m === 'const') enterConst();
  document.getElementById('hint').textContent = MODE_HINT[m];
}

/* ---------- dive (step close) ---------- */
var diveStack = [];
var flippedP = null, divedP = null;

function flipTo(p){
  if (flippedP && flippedP !== p) flippedP.el.classList.remove('flipped');
  flippedP = p;
  if (p) p.el.classList.add('flipped');
}
function dive(p, flip){
  if (!document.body.classList.contains('dived'))
    diveStack.push({x: cam.x, y: cam.y, s: cam.s});
  var s = Math.min(2.6, ((vh() - DESK_H()) * .92) / PH);
  centerPhoto(p, s);
  document.body.classList.add('dived');
  if (divedP) divedP.el.style.zIndex = '';
  divedP = p; p.el.style.zIndex = 70;
  if (flip) flipTo(p); else flipTo(null);
}
function closeDive(instant){
  flipTo(null);
  if (divedP){ divedP.el.style.zIndex = ''; divedP = null; }
  document.body.classList.remove('dived');
  var c = diveStack.pop();
  if (c){ if (instant){ world.classList.remove('glide'); cam = c; setCam(); }
          else glideTo(c.x, c.y, c.s); }
}
document.getElementById('offwall').addEventListener('click', function(){ closeDive(); });
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape' && document.body.classList.contains('dived')) closeDive();
});

/* ---------- the thread ---------- */
var holdTimer = null, heldPhoto = null, threadLines = [];
function maybeStartHold(e){
  if (state.mode !== 'thread') return;
  var pe = e.target.closest && e.target.closest('.photo');
  if (!pe) return;
  var p = byTitle[pe.dataset.key];
  if (!p || !adj[p.key]) return;
  holdTimer = setTimeout(function(){ holdTimer = null; lightThread(p); }, 240);
}
function cancelHold(){ if (holdTimer){ clearTimeout(holdTimer); holdTimer = null; } }
function releaseHold(){
  cancelHold();
  if (heldPhoto) dimThread();
}
function lightThread(p){
  heldPhoto = p;
  document.body.classList.add('holding');
  var cx = p.home.x + PW / 2, cy = p.home.y + PH / 2;
  (adj[p.key] || []).forEach(function(a){
    var k = byTitle[a.kin]; if (!k) return;
    var kx = k.home.x + PW / 2, ky = k.home.y + PH / 2;
    var ln = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    ln.setAttribute('x1', cx); ln.setAttribute('y1', cy);
    ln.setAttribute('x2', kx); ln.setAttribute('y2', ky);
    ln.setAttribute('stroke-width', (a.weight >= 3 ? 3 : a.weight === 2 ? 2.4 : 1.8) / cam.s);
    var len = Math.hypot(kx - cx, ky - cy);
    ln.style.strokeDasharray = len; ln.style.strokeDashoffset = len;
    ln.style.opacity = (.4 + a.weight * .14).toFixed(2);
    ln.style.transition = 'stroke-dashoffset .28s ease-out, opacity .18s';
    threads.appendChild(ln); threadLines.push(ln);
    k.el.classList.add('lit');
    requestAnimationFrame(function(){ ln.style.strokeDashoffset = 0; });
  });
  p.el.classList.add('lit');
}
function dimThread(){
  document.body.classList.remove('holding');
  threadLines.forEach(function(ln){ ln.classList.add('fadeout'); });
  var dead = threadLines; threadLines = [];
  setTimeout(function(){ dead.forEach(function(ln){ ln.remove(); }); }, 220);
  photos.forEach(function(p){ p.el.classList.remove('lit'); });
  heldPhoto = null;
}

/* ---------- constellations: links become distance ---------- */
var constLabels = [];
function enterConst(){
  var linked = photos.filter(function(p){ return adj[p.key]; })
    .sort(function(a, b){ return a.key < b.key ? -1 : 1; });
  if (!linked.length) return;
  /* deterministic force sim */
  var n = linked.length, cols = Math.ceil(Math.sqrt(n));
  var pos = {};
  linked.forEach(function(p, i){
    pos[p.key] = {x: (i % cols) * 460, y: Math.floor(i / cols) * 460};
  });
  var REST = {3: 360, 2: 480, 1: 640};
  for (var it = 0; it < 380; it++){
    var f = {};
    linked.forEach(function(p){ f[p.key] = {x: 0, y: 0}; });
    for (var a = 0; a < n; a++) for (var b = a + 1; b < n; b++){
      var A = linked[a], B = linked[b];
      var dx = pos[B.key].x - pos[A.key].x, dy = pos[B.key].y - pos[A.key].y;
      var d = Math.max(60, Math.hypot(dx, dy));
      var rep = 12000000 / (d * d);
      f[A.key].x -= dx / d * rep; f[A.key].y -= dy / d * rep;
      f[B.key].x += dx / d * rep; f[B.key].y += dy / d * rep;
    }
    linked.forEach(function(p){
      (adj[p.key] || []).forEach(function(e2){
        var K = pos[e2.kin]; if (!K) return;
        var dx = K.x - pos[p.key].x, dy = K.y - pos[p.key].y;
        var d = Math.max(1, Math.hypot(dx, dy));
        var pull = 0.05 * (d - REST[e2.weight]);
        f[p.key].x += dx / d * pull; f[p.key].y += dy / d * pull;
      });
    });
    var cool = it < 60 ? 46 : it < 200 ? 30 : 14;
    linked.forEach(function(p){
      var fx = Math.max(-cool, Math.min(cool, f[p.key].x));
      var fy = Math.max(-cool, Math.min(cool, f[p.key].y));
      pos[p.key].x += fx; pos[p.key].y += fy;
    });
  }
  /* fit the cluster field over the definitive wall */
  var xs = linked.map(function(p){ return pos[p.key].x; });
  var ys = linked.map(function(p){ return pos[p.key].y; });
  var minx = Math.min.apply(0, xs), maxx = Math.max.apply(0, xs);
  var miny = Math.min.apply(0, ys), maxy = Math.max.apply(0, ys);
  var r = regions.def;
  var sc = Math.min(1, (r.w * 1.35) / Math.max(900, maxx - minx),
                    (r.h * .95) / Math.max(900, maxy - miny));
  var ox = r.x + 120, oy = r.y + 260;
  linked.forEach(function(p){
    p.el.style.left = (ox + (pos[p.key].x - minx) * sc) + 'px';
    p.el.style.top = (oy + (pos[p.key].y - miny) * sc) + 'px';
    p.constXY = {x: ox + (pos[p.key].x - minx) * sc, y: oy + (pos[p.key].y - miny) * sc};
  });
  photos.forEach(function(p){ if (!adj[p.key]) p.el.classList.add('dim'); });
  /* relation labels at member centroids */
  var rels = {};
  LINKS.forEach(function(l){
    if (!byTitle[l.from] || !byTitle[l.to]) return;
    (rels[l.relation] = rels[l.relation] || []).push(l.from, l.to);
  });
  Object.keys(rels).sort().forEach(function(rel){
    var mem = rels[rel].filter(function(t, i, arr){ return arr.indexOf(t) === i; });
    var cx = 0, cy = 0, c = 0;
    mem.forEach(function(t){
      var p = byTitle[t]; if (!p || !p.constXY) return;
      cx += p.constXY.x + PW / 2; cy += p.constXY.y + PH / 2; c++;
    });
    if (!c) return;
    var lb = document.createElement('div'); lb.className = 'constlabel';
    lb.style.left = (cx / c + jit(rel + 'lx', 160)) + 'px';
    lb.style.top = (cy / c - 232 + jit(rel + 'ly', 120)) + 'px';
    lb.textContent = rel.replace(/-/g, ' ');
    world.appendChild(lb); constLabels.push(lb);
  });
  /* camera: fit what actually happened, not the plan */
  var fx0 = 1e9, fy0 = 1e9, fx1 = -1e9, fy1 = -1e9;
  linked.forEach(function(p){
    fx0 = Math.min(fx0, p.constXY.x); fy0 = Math.min(fy0, p.constXY.y);
    fx1 = Math.max(fx1, p.constXY.x + PW); fy1 = Math.max(fy1, p.constXY.y + PH);
  });
  fitRect({x: fx0 - 80, y: fy0 - 300, w: fx1 - fx0 + 160, h: fy1 - fy0 + 380});
}
function exitConst(){
  constLabels.forEach(function(l){ l.remove(); }); constLabels = [];
  photos.forEach(function(p){
    p.el.classList.remove('dim'); p.constXY = null;
    p.el.style.left = p.home.x + 'px'; p.el.style.top = p.home.y + 'px';
  });
}

/* ---------- clicks ---------- */
document.addEventListener('click', function(e){
  if (moved) return;                       /* it was a pan, not a click */
  var t = e.target;
  if (t.classList.contains('more-toggle')){
    var m = t.nextElementSibling;
    m.classList.toggle('open');
    t.textContent = m.classList.contains('open') ? 'less −' : 'more from the chat +';
    return;
  }
  if (t.classList.contains('goto')){
    var kin = byTitle[t.dataset.goto];
    if (kin){ dive(kin, true); }
    return;
  }
  if (t.classList.contains('cert-btn')){
    var w = t.parentNode; w.classList.add('open');
    w.querySelector('.cert-why').focus(); return;
  }
  if (t.classList.contains('cert-go')){ certify(photoOf(t)); return; }
  if (t.classList.contains('cert-undo')){ uncertify(photoOf(t)); return; }
  var pe = t.closest && t.closest('.photo');
  if (pe){
    var p = byTitle[pe.dataset.key];
    if (!p) return;
    if (pe.classList.contains('flipped')) return;   /* reading; let it be */
    dive(p, state.mode === 'backs');
  }
});
function photoOf(el){
  var pe = el.closest('.photo');
  return byTitle[pe.dataset.key];
}
document.addEventListener('keydown', function(e){
  if (e.key !== 'Enter') return;
  var t = e.target;
  if (t.classList && (t.classList.contains('cert-why') || t.classList.contains('cert-score'))){
    e.preventDefault(); certify(photoOf(t));
  }
});

/* ---------- certification (stateless; facts live with Leonard) ---------- */
var pending = {};
function certify(p){
  var f = p.sec.querySelector('.certform');
  var si = f.querySelector('.cert-score'), wi = f.querySelector('.cert-why');
  var v = parseFloat(si.value);
  si.classList.remove('bad'); wi.classList.remove('bad');
  if (isNaN(v) || v < 0 || v > 10){ si.classList.add('bad'); si.focus(); return; }
  if (!wi.value.trim()){ wi.classList.add('bad'); wi.focus(); return; }
  v = Math.round(v * 10) / 10;
  if (!p.sec.dataset.arcscore) p.sec.dataset.arcscore = p.sec.dataset.score;
  pending[p.key] = {score: v, why: wi.value.trim()};
  p.sec.dataset.score = v.toFixed(1);
  p.score = v;
  p.state = 'cert';
  p.sec.setAttribute('data-cert', 'pending');
  p.el.classList.remove('st-arc'); p.el.classList.add('st-cert');
  p.sec.querySelector('.score').innerHTML = v.toFixed(1) + '<small> /10</small>';
  p.sec.querySelector('.meta').innerHTML = 'The Vault · certified from memory · pending Leonard';
  p.sec.querySelector('.cd-n').textContent = v.toFixed(1);
  p.sec.querySelector('.certwrap').classList.add('done');
  p.sec.querySelector('.certwrap').classList.remove('open');
  paintChin(p);
  syncTray();
  closeDive(true);
  layout();                                   /* it re-ranks in place */
  centerPhoto(p, Math.max(cam.s, .5));        /* and scrolls back into view */
}
function uncertify(p){
  delete pending[p.key];
  var back = parseFloat(p.sec.dataset.arcscore);
  p.sec.dataset.score = back.toFixed(1);
  p.score = back;
  p.state = 'arc';
  p.sec.removeAttribute('data-cert');
  p.el.classList.add('st-arc'); p.el.classList.remove('st-cert');
  p.sec.querySelector('.score').innerHTML = back.toFixed(1) + '<small> /10</small>';
  p.sec.querySelector('.meta').innerHTML = 'The Vault · scored from memory · ' + p.sec.dataset.when;
  p.sec.querySelector('.certwrap').classList.remove('done');
  paintChin(p);
  syncTray();
  if (document.body.classList.contains('dived')) closeDive(true);
  layout();
}
function syncTray(){
  var keys = Object.keys(pending);
  var tray = document.getElementById('tray'), code = document.getElementById('traycode');
  if (!keys.length){
    tray.classList.remove('on'); code.classList.remove('on');
    document.getElementById('trayshow').textContent = 'Show';
    tally(); return;
  }
  tray.classList.add('on');
  document.getElementById('traycount').textContent =
    keys.length + (keys.length === 1 ? ' film certified. ' : ' films certified. ') +
    'Written in pen, but not yet a fact. Facts live with Leonard. Copy this and paste it in the chat.';
  code.value = 'CERTIFY\n' + keys.map(function(k){
    return k + ' | ' + pending[k].score.toFixed(1) + ' | ' + pending[k].why;
  }).join('\n');
  tally();
}
document.getElementById('traycopy').onclick = function(){
  var code = document.getElementById('traycode');
  code.classList.add('on');
  document.getElementById('trayshow').textContent = 'Hide';
  code.select();
  try{ navigator.clipboard.writeText(code.value) }catch(err){ try{ document.execCommand('copy') }catch(e2){} }
  var b = document.getElementById('traycopy');
  b.textContent = 'Copied';
  setTimeout(function(){ b.textContent = 'Copy for Leonard'; }, 1600);
};
document.getElementById('trayshow').onclick = function(){
  var code = document.getElementById('traycode');
  code.classList.toggle('on');
  this.textContent = code.classList.contains('on') ? 'Hide' : 'Show';
};
document.getElementById('trayclear').onclick = function(){
  Object.keys(pending).forEach(function(k){
    var p = byTitle[k]; if (p) uncertify(p);
  });
};

/* ---------- desk ---------- */
[].slice.call(document.querySelectorAll('.opt[data-mode]')).forEach(function(o){
  o.addEventListener('click', function(){
    [].slice.call(document.querySelectorAll('.opt[data-mode]')).forEach(function(x){ x.classList.remove('on'); });
    o.classList.add('on');
    setMode(o.dataset.mode);
  });
});
[].slice.call(document.querySelectorAll('.opt[data-go]')).forEach(function(o){
  o.addEventListener('click', function(){
    if (document.body.classList.contains('dived')) closeDive(true);
    fitRect(regions[o.dataset.go === 'all' ? 'all' :
            o.dataset.go === 'box' ? 'box' :
            o.dataset.go === 'hazy' ? 'hazy' : 'def']);
  });
});

/* ---------- boot ---------- */
document.body.classList.add('noanim');
buildPhotos();
resolveLinks();
layout();
fitRect(regions.def, 40);
world.classList.remove('glide');
setCam();
requestAnimationFrame(function(){ requestAnimationFrame(function(){
  document.body.classList.remove('noanim');
}); });
document.getElementById('hint').textContent = MODE_HINT.wall;

/* the chemicals: photos develop in on arrival */
var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if (!reduce){
  photos.forEach(function(p){ if (p.state !== 'hazy') p.el.classList.add('undev'); });
  photos.forEach(function(p, i){
    if (p.state === 'hazy') return;
    setTimeout(function(){ p.el.classList.remove('undev'); }, 240 + (i % 40) * 34);
  });
}
