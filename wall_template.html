<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Vault</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Caveat:wght@400;600;700&family=Schibsted+Grotesk:ital,wght@0,400;0,500;0,700;1,400&display=swap');
:root{--wall:#E8E2D6;--wall2:#DCD4C4;--ink:#1C1914;--mid:#6E675A;--rule:#D2C9B8;--photo:#FFFEF8;--pencil:#8A8272;--pen:#25221C;--thread:#C42B2B;
  --room-w:2100px;--room-h:1300px;--room-d:1700px}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:radial-gradient(1400px 900px at 30% 10%,var(--wall) 0%,var(--wall2) 70%,#D4CBB9 100%);color:var(--ink);font-family:'Schibsted Grotesk',sans-serif;font-size:15px;line-height:1.6}

/* ============ v5: the motel room is a real preserve-3d box ============
   #frontWall and #backswall are true opposite-facing planes of the same
   box (front at FRONT_Z, backs at BACK_Z, rotateY(180)-mounted) -- both are
   always "up"; whichever one the eye is pointed at is what you see. #world
   and #backsInner (which host the actual .photo elements, unchanged from
   v4) carry NO transform of their own: the ONLY thing that ever moves is
   #room's camera transform. The existing 2D pan/zoom state (cam.x/y/s) is
   converted every animation frame into an equivalent 3D eye pose by
   derivePose() (see the DERIVATION LAYER in the script) -- when the eye
   faces a wall head-on, CSS perspective projects it as the exact same
   uniform 2D similarity cam.x/y/s always produced, so every existing pan/
   zoom/dive/fitRect call site keeps working unmodified. Floor, ceiling,
   side walls, door/neon, window/curtains, the lamp, and the table/
   nightstand furniture are real geometry too now, built by buildRoom()
   below -- see v5-room-proof.html for the screenshot-verified rig this
   was transplanted from. */
/* ============ v5: real preserve-3d motel room ============
   one unit system: WALL PIXELS. #world/#backsInner carry NO transform of
   their own -- the CSS camera (translateZ(PERSP) rotateX rotateY translate3d
   on #room) does everything. cam.x/y/s (unchanged 2D pan/zoom state) is
   converted every rAF frame into an equivalent 3D eye pose by derivePose();
   see the DERIVATION LAYER comment block in the script. #frontWall and
   #backswall are real, oppositely-facing planes of the same box -- both are
   always "up"; whichever one the eye is pointed at is the one you see. */
#viewport{position:fixed;inset:0;overflow:hidden;cursor:grab;touch-action:none;perspective:1000px;perspective-origin:50% 50%;background:#050403;z-index:1}
#viewport.panning{cursor:grabbing}
#room{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d}
.plane{position:absolute;left:0;top:0;transform-style:preserve-3d}
/* NO backface-visibility:hidden anywhere in the room box -- inside a box you
   always face the back of half the planes; culling them voids the room. */
#frontWall,#backswall{position:absolute;left:0;top:0}
#world{position:absolute;left:0;top:0}
#backswall{
  /* the evidence-backs wall: same aged-wallpaper family as the front wall,
     shifted a shade darker/moodier -- this is the "case board" side, it
     should feel one degree colder, not just a void behind floating cards. */
  background:
    radial-gradient(30% 22% at 96% 3%,rgba(50,42,28,.28),rgba(50,42,28,0) 70%),
    radial-gradient(26% 34% at 3% 4%,rgba(44,36,24,.24),rgba(44,36,24,0) 70%),
    radial-gradient(38% 26% at 88% 97%,rgba(40,32,20,.4),rgba(40,32,20,0) 62%),
    radial-gradient(30% 30% at 8% 90%,rgba(36,28,18,.3),rgba(36,28,18,0) 65%),
    repeating-linear-gradient(90deg,rgba(20,17,13,.09) 0 3px,rgba(20,17,13,0) 3px 110px,rgba(20,17,13,.05) 110px 113px,rgba(20,17,13,0) 113px 220px),
    linear-gradient(180deg,rgba(10,8,6,.5) 0%,rgba(0,0,0,0) 16%),
    linear-gradient(180deg,#4A4438 0%,#3A362C 55%,#2A261E 100%);
  box-shadow:
    inset 220px 0 200px -160px rgba(0,0,0,.6),
    inset -220px 0 200px -160px rgba(0,0,0,.6),
    inset 0 160px 150px -110px rgba(0,0,0,.55),
    inset 0 -220px 200px -140px rgba(0,0,0,.6)}
#backsInner{position:absolute;left:0;top:0}
/* the wallpaper family for the front wall plane itself (was .arch.wallpanel,
   painted only over the salon extent -- now the whole room-scale plane) */
#frontWall{
  background:
    linear-gradient(178deg,transparent 0%,transparent 4%,rgba(94,84,52,.30) 4.4%,rgba(94,84,52,.16) 30%,transparent 46%) no-repeat,
    radial-gradient(30% 22% at 96% 3%,rgba(80,62,36,.24),rgba(80,62,36,0) 70%),
    radial-gradient(26% 34% at 3% 4%,rgba(70,55,32,.20),rgba(70,55,32,0) 70%),
    radial-gradient(38% 26% at 88% 97%,rgba(70,52,32,.36),rgba(70,52,32,0) 62%),
    radial-gradient(30% 30% at 8% 90%,rgba(60,46,30,.26),rgba(60,46,30,0) 65%),
    repeating-linear-gradient(90deg,rgba(110,103,90,.07) 0 3px,rgba(110,103,90,0) 3px 110px,rgba(110,103,90,.035) 110px 113px,rgba(110,103,90,0) 113px 220px),
    linear-gradient(180deg,rgba(255,252,244,.34) 0%,rgba(255,252,244,.05) 14%,rgba(0,0,0,0) 34%),
    linear-gradient(180deg,#DDD3BE 0%,#CBBFA3 55%,#B7A985 100%);
  box-shadow:
    inset 220px 0 180px -170px rgba(20,15,10,.45),
    inset -220px 0 180px -170px rgba(20,15,10,.45),
    inset 0 160px 140px -110px rgba(20,15,10,.4),
    inset 0 -220px 180px -140px rgba(40,30,18,.5)}
/* ---------- real room shell planes (built in JS by buildRoom()) ---------- */
#wFloor{background:
    radial-gradient(ellipse 55% 45% at 50% 40%,rgba(255,214,160,.10),transparent 70%),
    repeating-linear-gradient(90deg,#241a12 0 6px,#2e2118 6px 170px,#201811 170px 176px,#2a1f16 176px 340px),
    linear-gradient(180deg,#241a12,#1a130d);
  box-shadow:inset 0 0 420px 160px rgba(0,0,0,.72)}
#wCeil{background:
    radial-gradient(ellipse 34% 40% at 68% 42%,rgba(90,70,40,.5),rgba(60,45,25,.25) 55%,transparent 75%),
    linear-gradient(180deg,#2c261e,#221d17);
  box-shadow:inset 0 0 380px 150px rgba(0,0,0,.7)}
#wLeft,#wRight{background:
    repeating-linear-gradient(90deg,rgba(255,240,210,.035) 0 3px,transparent 3px 96px),
    linear-gradient(180deg,#4e4235 0%,#423829 55%,#362e24 100%);
  box-shadow:inset 0 0 320px 110px rgba(0,0,0,.6)}
.rail3{background:linear-gradient(180deg,#6b5a44,#4f4232 60%,#3a3126);box-shadow:0 6px 18px rgba(0,0,0,.5)}
.baseboard3{background:linear-gradient(180deg,#3d3325,#2b241b);box-shadow:0 -4px 14px rgba(0,0,0,.4)}
#doorFrame3{background:#171310;box-shadow:inset 0 0 60px 20px #000}
#doorGlow3{background:radial-gradient(ellipse 60% 90% at 50% 55%,rgba(255,95,162,.55),rgba(255,95,162,.18) 55%,transparent 78%);filter:blur(6px);animation:neon3 7.5s infinite}
@keyframes neon3{0%,86%,90%,100%{opacity:1}87%,89%{opacity:.35}47%{opacity:.85}}
#neonWash3{background:radial-gradient(ellipse 50% 60% at 50% 50%,rgba(255,95,162,.22),transparent 72%);filter:blur(10px)}
#winNight3{background:linear-gradient(180deg,#0a1226 0%,#101b36 55%,#0a0f1e 100%);box-shadow:inset 0 0 90px 20px rgba(0,0,0,.8)}
.curtain3{background:repeating-linear-gradient(90deg,#3a2c2a 0 34px,#2c211f 34px 68px),linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.5));box-shadow:0 0 40px rgba(0,0,0,.6)}
.wood3a{background:linear-gradient(180deg,#3b2b1d,#2e2118)}
.wood3b{background:linear-gradient(180deg,#33251a,#271c13)}
.wood3c{background:#1f1710}
.shadowBlob3{background:radial-gradient(ellipse 50% 50% at 50% 50%,rgba(0,0,0,.55),transparent 70%);filter:blur(8px)}
#lampGlow3{background:radial-gradient(ellipse 55% 65% at 50% 62%,rgba(255,217,160,.34),rgba(255,190,120,.12) 55%,transparent 78%);filter:blur(8px)}
.mote3{transform-style:preserve-3d}
.mote3>i{display:block;width:100%;height:100%;background:radial-gradient(circle,#ffe9c8,transparent 70%);border-radius:50%;opacity:.5}
/* the shoebox lid + drawer front: now real tilted planes hovering over the
   furniture, not flat wall dressing. click opens; prints (already in the DOM,
   just re-parented into #boxInner/#drawerInner by layout()) fade in via the
   same body.box-closed/drawer-closed opacity rule as before. */
#boxPlane,#drawerPlane{pointer-events:none}
#boxLid,#drawerLid{pointer-events:auto;cursor:pointer;transition:opacity .5s}
#boxLid{background:linear-gradient(172deg,#CBB48A,#B0925F 55%,#93764C);box-shadow:0 16px 30px rgba(50,40,28,.4),inset 0 2px 0 rgba(255,246,222,.5)}
#drawerLid{background:linear-gradient(180deg,#4E4636,#39321F 60%,#2A2515);box-shadow:0 12px 24px rgba(0,0,0,.4),inset 0 0 0 2px rgba(0,0,0,.3)}
.lidtxt{font-family:'Caveat',cursive;color:#3A2F1E;text-align:center;pointer-events:none;font-size:30px;padding-top:14px}
.lidtxt span{display:block;font-size:16px;color:#5A4A30;margin-top:4px}
#drawerLid .lidtxt{color:#D8CDB4}
#drawerLid .lidtxt span{color:#A89C82}
body.box-closed #boxLid{opacity:1;pointer-events:auto}
body:not(.box-closed) #boxLid{opacity:0;pointer-events:none}
body.drawer-closed #drawerLid{opacity:1;pointer-events:auto}
body:not(.drawer-closed) #drawerLid{opacity:0;pointer-events:none}

/* cold open: waking from a coma */
#lids{position:fixed;inset:0;z-index:200;pointer-events:none}
#lids .lid{position:absolute;left:0;right:0;height:52%;background:#050403}
#lids .lidTop{top:0}
#lids .lidBot{bottom:0}
body.coldopen #lids .lid{transition:transform 1.4s cubic-bezier(.6,0,.2,1)}
body.coldopen.blink1 #lids .lidTop{transform:translateY(-8%)}
body.coldopen.blink1 #lids .lidBot{transform:translateY(8%)}
body.coldopen.blink2 #lids .lidTop{transform:translateY(-100%)}
body.coldopen.blink2 #lids .lidBot{transform:translateY(100%)}
body.coldopen #room{filter:blur(6px) brightness(.5)}
body.coldopen.blink2 #room{transition:filter 1.6s ease;filter:blur(0) brightness(1)}
body.awake #lids{display:none}
/* dust motes, seated idle */
.mote{position:absolute;border-radius:50%;background:rgba(255,224,170,.5);pointer-events:none;
  animation:motedrift 11s linear infinite}
@keyframes motedrift{0%{transform:translate(0,0);opacity:0}10%{opacity:.6}90%{opacity:.4}100%{transform:translate(24px,-140px);opacity:0}}
#source{display:none}

/* room architecture: v4 painted the wall/rail/baseboard/floor/lamp/box/
   cabinet as flat .arch divs on #world. v5 replaces all of that with real
   3D geometry (buildRoom(), plane()/box() below) -- only the opacity gates
   for the shoebox/drawer prints stay wired to the same body classes. */
.arch{position:absolute;pointer-events:none}
body.box-closed .photo.st-arc{opacity:0;pointer-events:none}
body.drawer-closed .photo.st-hazy{opacity:0;pointer-events:none}

/* painted-on-the-wall text */
.wtx{position:absolute;pointer-events:none}
.wtx .over{font-size:13px;font-weight:700;letter-spacing:.34em;text-transform:uppercase;color:var(--mid);margin-bottom:26px}
.wtx h1{font-family:'Instrument Serif',serif;font-weight:400;font-style:italic;font-size:150px;line-height:.92;color:var(--ink)}
.wtx .dek{max-width:56ch;margin-top:30px;font-size:17px;line-height:1.65}
.wtx .dek em{font-family:'Caveat',cursive;font-style:normal;font-size:25px;font-weight:600}
.wtx .facts{font-size:13.5px;color:var(--mid);margin-top:20px;max-width:80ch}
.wtx .facts b{font-weight:700;color:var(--ink)}
.bandhead{position:absolute;pointer-events:none;white-space:nowrap}
.bandhead h2{font-family:'Caveat',cursive;font-weight:700;font-size:44px;line-height:1;color:var(--pen);display:inline;opacity:.85}
.bandhead span{font-family:'Caveat',cursive;font-size:22px;color:var(--mid);margin-left:14px}
.roomhead{position:absolute;pointer-events:none}
.roomhead h2{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;font-size:64px;color:var(--ink)}
.roomhead.dark h2{color:#B7AE9C}
.roomhead p{font-family:'Caveat',cursive;font-size:23px;color:var(--mid);margin-top:4px}
.roomhead.dark p{color:#7E776A}
.colo{position:absolute;pointer-events:none;max-width:620px}
.colo .prod{font-size:12px;font-weight:700;letter-spacing:.24em;text-transform:uppercase}
.colo .line{font-family:'Caveat',cursive;font-size:27px;font-weight:600;margin-top:10px;color:var(--pen)}
.colo .fn{font-size:12.5px;color:var(--mid);margin-top:16px}
.colo .fn b{color:var(--ink);font-weight:500}

/* ============ one photo ============ */
.photo{position:absolute;width:264px;height:324px;cursor:pointer;transition:left .7s cubic-bezier(.3,.8,.3,1),top .7s cubic-bezier(.3,.8,.3,1),transform .7s cubic-bezier(.3,.8,.3,1),opacity .45s;transform:rotate(var(--rot,0deg)) scale(var(--sc,1));transform-origin:50% 50%}
.photo:hover{z-index:40}
.photo.read{z-index:60}
body.noanim .photo{transition:none !important}
body.mode-wall .photo:hover,body.mode-backs .photo:hover{transform:rotate(0deg) scale(var(--sc,1)) translateY(-4px)}
.photo.dim{opacity:.16;pointer-events:none}
.photo.lit{z-index:35}
.photo.lit .card{box-shadow:0 10px 26px rgba(28,25,20,.3),0 0 0 3px rgba(255,214,206,.85),0 0 26px 4px rgba(214,58,48,.35)}
/* tape, with the penciled case number on it */
.photo::before{content:'';position:absolute;top:-13px;left:50%;width:96px;height:27px;transform:translateX(-50%) rotate(-2.2deg);background:linear-gradient(100deg,rgba(244,238,218,.62),rgba(238,230,206,.5));box-shadow:0 1px 3px rgba(28,25,20,.14);z-index:5}
.photo:nth-child(3n)::before{transform:translateX(-50%) rotate(1.8deg)}
.photo.fresh::before{background:linear-gradient(100deg,rgba(255,253,246,.94),rgba(250,246,232,.86));box-shadow:0 1px 4px rgba(28,25,20,.2)}
.photo.fresh .card{box-shadow:0 18px 34px rgba(28,25,20,.26),0 4px 10px rgba(28,25,20,.16),0 0 0 2px rgba(255,252,240,.9)}
.rank{position:absolute;top:-11px;left:50%;transform:translateX(-50%) rotate(-2deg);z-index:6;font-family:'Caveat',cursive;font-size:16px;font-weight:600;color:var(--pencil);pointer-events:none;white-space:nowrap}
.card{position:relative;width:100%;height:100%;box-shadow:0 18px 34px rgba(28,25,20,.26),0 4px 10px rgba(28,25,20,.16);background:var(--photo);border-radius:2px}
.face{position:absolute;inset:0;background:var(--photo);border-radius:2px}
.face.front::after{content:'';position:absolute;right:0;bottom:0;width:34px;height:34px;background:linear-gradient(315deg,rgba(28,25,20,.10),rgba(28,25,20,0) 55%);border-radius:0 0 2px 0}
/* backs wall: the same card shell, but its whole face is the back content */
.face.back{overflow:hidden}
.photo.read .card{box-shadow:0 24px 50px rgba(0,0,0,.4),0 0 0 3px rgba(255,252,240,.9)}

/* the image field */
.img{position:absolute;top:14px;left:14px;width:236px;height:236px;background:var(--bg);color:var(--fg);overflow:hidden}
.img::before{content:var(--glyph);position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:96px;line-height:1;color:var(--sub);opacity:.55;font-family:'Schibsted Grotesk',sans-serif}
.img.hasphoto::before{content:none}
.img svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.img::after{content:'';position:absolute;inset:0;background:linear-gradient(118deg,rgba(255,255,255,.14) 0%,rgba(255,255,255,0) 34%),radial-gradient(120% 90% at 50% 108%,rgba(0,0,0,.12),rgba(0,0,0,0) 55%)}
.photo .img{transition:filter .9s ease}
.photo.undev .img{filter:brightness(.16) saturate(.05) contrast(.75)}

/* the chin: handwriting on the border */
.chin{position:absolute;left:15px;right:15px;bottom:8px;height:62px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;color:var(--pen)}
.cfilm{font-family:'Caveat',cursive;font-weight:600;font-size:21px;line-height:.98;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cfilm span{font-size:15px;color:var(--pencil);margin-left:5px}
.cscore{font-family:'Caveat',cursive;font-weight:700;font-size:27px;white-space:nowrap}
.cscore small{font-size:14px;color:var(--pencil);font-weight:400}
.cscore .cmode{display:block;font-size:12.5px;color:var(--pencil);font-weight:400;line-height:.9;text-align:right}

/* state: the shoebox (evidence in waiting: a contact print, not a scene) */
.photo.st-arc .img{filter:grayscale(.85) contrast(.82) brightness(1.1)}
.photo.st-arc .img::before{opacity:.4}
.photo.st-arc.undev .img{filter:brightness(.16) saturate(.05) contrast(.75)}
.photo.st-arc .cfilm,.photo.st-arc .cscore{color:var(--pencil)}
.photo.st-arc .card{box-shadow:0 8px 18px rgba(28,25,20,.28),0 2px 6px rgba(28,25,20,.16)}
.photo.st-arc::before{display:none}
.photo.st-arc .img::after{content:'';background:linear-gradient(118deg,rgba(255,255,255,.1) 0%,rgba(255,255,255,0) 34%),radial-gradient(120% 90% at 50% 108%,rgba(0,0,0,.16),rgba(0,0,0,0) 55%),repeating-linear-gradient(0deg,rgba(255,254,248,.05) 0 2px,rgba(0,0,0,.02) 2px 4px)}
.photo.st-arc .awaiting{position:absolute;left:15px;top:16px;z-index:4;font-family:'Caveat',cursive;font-size:14px;color:var(--pencil);background:rgba(255,254,248,.75);padding:1px 7px;border-radius:3px;transform:rotate(-2deg)}
/* state: hazy, the chemicals never finished */
.photo.st-hazy .img{background:linear-gradient(160deg,#23211B 0%,#2E2B23 55%,#26241D 100%);color:#4A463C}
.photo.st-hazy .img::before{opacity:.18;color:#8A8272}
.photo.st-hazy .cfilm{color:var(--pencil)}
.photo.st-hazy .cscore{font-size:15px;color:var(--pencil);font-weight:400}
.photo.st-hazy::before{display:none}
.photo.st-hazy .card{box-shadow:0 6px 14px rgba(0,0,0,.4)}
/* state: certified. the DNA came back: full scene, full color, in pen */
.photo.st-cert .img{filter:none}
.photo.st-cert .img::before{opacity:.55}
.photo.st-cert .cfilm,.photo.st-cert .cscore{color:var(--pen)}
.photo.st-cert::before{display:block}
/* the development: certify plays the chemical bath */
@keyframes develop{0%{filter:brightness(.14) saturate(.05) contrast(.7)}55%{filter:brightness(.7) saturate(.5) contrast(.9) sepia(.3)}100%{filter:none}}
.photo.developing .img{animation:develop 1.2s ease forwards}

/* ============ the back of the photo ============ */
.backscale{width:660px;height:810px;transform:scale(.4);transform-origin:0 0;overflow-y:auto;overflow-x:hidden;padding:34px 38px 40px;color:var(--pen);background:var(--photo)}
.backscale::-webkit-scrollbar{width:10px}
.backscale::-webkit-scrollbar-thumb{background:var(--rule);border-radius:5px}
.backscale section.panel{background:none !important;color:var(--pen);filter:none !important;display:block}
.backscale .no{font-size:11px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--pencil)}
.backscale .head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-top:8px}
.backscale .film{font-family:'Instrument Serif',serif;font-size:37px;line-height:1.02;color:var(--pen)}
.backscale .film span{font-family:'Schibsted Grotesk';font-size:13px;color:var(--pencil);margin-left:7px}
.backscale .score{font-family:'Instrument Serif',serif;font-size:37px;color:var(--pen);white-space:nowrap}
.backscale .score small{font-size:14px;color:var(--pencil)}
.backscale .meta{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--pencil);margin-top:9px}
.backscale .plot{margin-top:16px;max-width:58ch;font-size:14.5px}
.backscale .quote{font-family:'Instrument Serif',serif;font-style:italic;font-size:22px;line-height:1.3;margin-top:18px;max-width:36ch}
.backscale .quote::before{content:'what you said, verbatim';display:block;font-family:'Caveat',cursive;font-size:16px;font-style:normal;color:var(--pencil);margin-bottom:2px}
.backscale .more-toggle{display:inline-block;font-family:'Caveat',cursive;font-size:17px;font-weight:600;margin-top:13px;cursor:pointer;user-select:none;opacity:.85;border-bottom:1px dashed currentColor;padding-bottom:1px}
.backscale .more{display:none;margin-top:8px}
.backscale .more.open{display:block}
.backscale .mq{font-family:'Instrument Serif',serif;font-style:italic;font-size:16.5px;line-height:1.4;margin-top:12px;max-width:52ch}
.backscale .mq b{font-family:'Caveat',cursive;font-style:normal;font-weight:600;font-size:15px;color:var(--pencil);display:block}
.backscale .debrief{margin-top:16px;color:#57503F;font-size:13.5px;max-width:58ch}
.backscale .debrief b{font-weight:500;color:var(--pen)}
.backscale .certnote{font-family:'Instrument Serif',serif;font-style:italic;font-size:20px;line-height:1.35;margin-top:16px;max-width:38ch}
.backscale .certnote b{display:block;font-family:'Caveat',cursive;font-style:normal;font-weight:600;font-size:15px;color:var(--pencil)}

/* see also, in the handwriting */
.seealso{margin-top:22px;border-top:1px dotted var(--rule);padding-top:14px}
.seealso .sahead{font-family:'Caveat',cursive;font-size:19px;font-weight:600;color:var(--pencil)}

<script>
'use strict';
var META = __META__;
var LINKS = __LINKS__;
var FACTS_HTML = __FACTS_JS__;
var PHOTOS = __PHOTOS__;

/* ---------- geometry ---------- */
var PW = 264, PH = 324;          /* one photo */
var SC_BOX = .56, SC_HAZY = .5;  /* evidence in waiting renders smaller */
var BANDS = [
  [10.0, 10.0, 'The Crown', 'the perfect scores'],
  [9.0, 9.99, 'The Nines', 'the podium, extremely crowded'],
  [8.0, 8.99, 'The Eights', 'the honest middle'],
  [7.0, 7.99, 'The Sevens', 'liked it, itemized the bill'],
  [0, 6.99, 'The Floor', 'and below']
];
/* salon geometry: photos per row, per band, hung around the center line */
var BAND_COLS = [1, 5, 4, 3, 4];

var world = document.getElementById('world');
var backsInner = document.getElementById('backsInner');
var viewport = document.getElementById('viewport');
var threads = document.getElementById('threads');
var stray = [];   /* wall-text + architecture rebuilt each layout */

/* =====================================================================
   V5 ROOM: real preserve-3d box, transplanted from v5-room-proof.html.
   Everything below lives in the SAME wall-px unit system as the salon
   hang. #frontWall/#backswall are ROOM_W x ROOM_H planes; #world/
   #backsInner (unchanged, still the flat photo layers) sit inside them
   at a fixed offset chosen so the wall's EYE line lands at room eye
   height. See wallRoomX/wallRoomY + derivePose() -- the DERIVATION LAYER
   -- for how cam.x/y/s (2D, untouched) becomes a 3D eye pose every frame.
   ===================================================================== */
var PERSP = 1000;                 /* must match #viewport's perspective */
/* SH: constant shrink factor applied to #world/#backsInner via a CSS
   transform (never animated, never touched again after this). Fixes the
   DPR-2 blank-room bug: at devicePixelRatio 2, Chromium rasterizes 3D
   -transformed layers at (CSS px * DPR), and any plane over the ~16384px
   GPU texture cap gets silently dropped. ROOM_W (which the wall's full W
   drives, up to ~11000 CSS px at DPR 1) blew past that cap at DPR 2.
   Shrinking the wall content visually by SH lets buildRoom() use SH*W/SH*H
   (WS/HS) for every physical plane that touches the wall extent, while
   ALL wall-content coordinates and the entire 2D interaction engine
   (cam{x,y,s}, fitRect, place(), etc.) stay in unchanged, unscaled wall
   px -- only the derivation layer (wallRoomX/wallRoomY/derivePose) knows
   about SH. */
var SH = 0.5;
var FLOOR_Y = 1040;
var room = document.getElementById('room');
var frontWall = document.getElementById('frontWall');
var backswall = document.getElementById('backswall');
var ROOM = null;                  /* filled by buildRoom() each layout() */
var roomFurniture = [];           /* plane/box els rebuilt each buildRoom() */

/* constant scale-down of the wall content layers -- set once, here, so SH
   lives in exactly one place. Never touched again by any other code path. */
world.style.transform = backsInner.style.transform = 'scale(' + SH + ')';
world.style.transformOrigin = backsInner.style.transformOrigin = '0 0';

function at(x, y, z){ return 'translate3d(' + x + 'px,' + y + 'px,' + z + 'px)'; }
/* plane(w,h,t,id,cls,parent): local (0,0) is the div's own top-left;
   translate(-50%,-50%) (origin 0 0, so it runs BEFORE the rotation in the
   transform's local-to-room composition) centers it at the transform's
   translate3d point, then the rotation turns the frame. origin 50% 50%
   silently displaces every rotated plane by half its size -- never use it
   here (known trap, hit before). No backface-visibility anywhere: inside
   a closed box you always face the back of half the planes. */
function plane(w, h, t, id, cls, parent){
  var el = document.createElement('div');
  el.className = 'plane' + (cls ? ' ' + cls : '');
  if (id) el.id = id;
  el.style.width = w + 'px'; el.style.height = h + 'px';
  el.style.transform = t + ' translate(-50%,-50%)';
  el.style.transformOrigin = '0 0';
  (parent || room).appendChild(el);
  roomFurniture.push(el);
  return el;
}
function box(cx, cy, cz, w, h, d, skins, parent){
  plane(w, h, at(cx, cy, cz + d / 2), null, skins.front, parent);
  plane(w, h, at(cx, cy, cz - d / 2) + ' rotateY(180deg)', null, skins.front, parent);
  plane(d, h, at(cx - w / 2, cy, cz) + ' rotateY(-90deg)', null, skins.side, parent);
  plane(d, h, at(cx + w / 2, cy, cz) + ' rotateY(90deg)', null, skins.side, parent);
  plane(w, d, at(cx, cy - h / 2, cz) + ' rotateX(90deg)', null, skins.top, parent);
}

/* wall-coord (wx,wy, in the same px space as place()) -> room-coord helpers,
   used only by the camera derivation -- the salon layout itself never
   changes units. */
function wallRoomX(wx){ return SH*wx - (ROOM.wallW * SH) / 2; }
function wallRoomY(wy){ return ROOM.CEIL_Y + ROOM.WALL_TOP + SH*wy; }

/* parallel-plane basis for the shoebox tray / drawer tray: a plane with NO
   tilt (zero rotation, same orientation as #frontWall) mounted at room-space
   origin O, whose LOCAL (0,0) is world-space wall point (region.x, region.y)
   -- so photos placed by place() at their ordinary wall coordinates need no
   per-photo remapping, only the container (#boxInner/#drawerInner) gets
   offset by -region.x/-region.y. Because the plane is parallel and head-on,
   this is IDENTICAL to the 'front' derivation with a different origin: no
   tilt math, no special-casing. Rejected the handoff's tilted-tray idea
   (CHANGELOG v5 deviation 2/3) -- a tilted plane interleaves in depth with
   the room's other geometry, which Chromium doesn't reliably z-sort in a
   nested preserve-3d scene, forcing a black-void visibility-gating hack.
   Parallel planes never interleave (they occupy one distinct z each), so
   nothing needs to be hidden; see updateVisibility() below. */
function parallelPose(region, O, wcx, wcy, dist){
  var lx = SH*(wcx - region.x - region.w / 2), ly = SH*(wcy - region.y - region.h / 2);
  return {x: O.x + lx, y: O.y + ly, z: O.z + dist, yaw: 0, pitch: 0};
}

/* derivePose(plane, camv): the whole trick, generalized per the PLANES
   table idea in the handoff -- front/backs/box/drawer are all "some flat
   plane, viewed head-on from dist=PERSP/s". */
function derivePose(facingName, camv){
  var s = camv.s, dist = SH * PERSP / s;
  var wcx = (vw() / 2 - camv.x) / s, wcy = (vh() / 2 - camv.y) / s;
  if (facingName === 'backs')
    return {x: -wallRoomX(wcx), y: wallRoomY(wcy), z: ROOM.BACK_Z - dist, yaw: 180, pitch: 0};
  if (facingName === 'box')
    return parallelPose(regions.box, ROOM.BOX_O, wcx, wcy, dist);
  if (facingName === 'drawer')
    return parallelPose(regions.hazy, ROOM.DRAWER_O, wcx, wcy, dist);
  return {x: wallRoomX(wcx), y: wallRoomY(wcy), z: ROOM.FRONT_Z + dist, yaw: 0, pitch: 0};
}

/* buildRoom(): (re)builds the real 3D shell + furniture around the current
   wall extent W x H. Called at the end of layout(), so it always matches
   the just-computed salon/box/drawer regions. Idempotent: clears its own
   previous furniture first (layout() reruns on certify/uncertify/step
   back/resize-fit). #frontWall/#world/#backswall/#backsInner themselves
   are NOT rebuilt (they're the permanent photo layers) -- only resized
   and repositioned. */
function buildRoom(W, H, arcs, hz){
  roomFurniture.forEach(function(e){ e.remove(); }); roomFurniture = [];
  /* WS/HS: the wall extent as it actually appears after the constant
     scale(SH) on #world/#backsInner -- every physical plane that meets
     the wall (ROOM_W/ROOM_H and anything derived from them) must be sized
     off THIS, not the raw wall-px W/H, or it blows the DPR-2 GPU texture
     cap again. */
  var WS = W * SH, HS = H * SH;
  var ROOM_W = Math.max(5600, WS + 800);
  var ROOM_H = Math.max(2600, HS + 300);
  var ROOM_D = Math.round(ROOM_W * 0.78);
  var CEIL_Y = FLOOR_Y - ROOM_H;
  var FRONT_Z = -ROOM_D / 2, BACK_Z = ROOM_D / 2;
  var LEFT_X = -ROOM_W / 2, RIGHT_X = ROOM_W / 2;
  /* WALL_TOP: vertically centers the wall content inside the ROOM_H plane.
     The handoff's literal formula (WALL_TOP = (-220-EYE)-CEIL_Y, anchoring
     the eye line to a fixed room-y) assumes wall content roughly the size
     of a domestic room; our salon wall is several times taller than
     ROOM_H's minimum, so that fixed anchor pushes WALL_TOP far past the
     plane's own bottom edge and the content renders into void below the
     wallpaper. Centering keeps the SAME derivation contract (wallRoomY is
     still computed from the real DOM offset, so mapping exactness is
     unaffected either way) while guaranteeing the content actually sits
     inside the plane it's mounted to. */
  var WALL_TOP = (ROOM_H - HS) / 2;

  /* mount + size the two content walls */
  frontWall.style.width = ROOM_W + 'px'; frontWall.style.height = ROOM_H + 'px';
  frontWall.style.transform = at(0, CEIL_Y + ROOM_H / 2, FRONT_Z) + ' translate(-50%,-50%)';
  frontWall.style.transformOrigin = '0 0';
  backswall.style.width = ROOM_W + 'px'; backswall.style.height = ROOM_H + 'px';
  backswall.style.transform = at(0, CEIL_Y + ROOM_H / 2, BACK_Z) + ' rotateY(180deg) translate(-50%,-50%)';
  backswall.style.transformOrigin = '0 0';
  world.style.left = ((ROOM_W - WS) / 2) + 'px'; world.style.top = WALL_TOP + 'px';
  backsInner.style.left = ((ROOM_W - WS) / 2) + 'px'; backsInner.style.top = WALL_TOP + 'px';

  /* the box + the six shell faces */
  plane(ROOM_D, ROOM_H, at(LEFT_X, CEIL_Y + ROOM_H / 2, 0) + ' rotateY(90deg)', 'wLeft');
  plane(ROOM_D, ROOM_H, at(RIGHT_X, CEIL_Y + ROOM_H / 2, 0) + ' rotateY(-90deg)', 'wRight');
  plane(ROOM_W, ROOM_D, at(0, FLOOR_Y, 0) + ' rotateX(90deg)', 'wFloor');
  plane(ROOM_W, ROOM_D, at(0, CEIL_Y, 0) + ' rotateX(-90deg)', 'wCeil');
  plane(ROOM_W, 46, at(0, -520, FRONT_Z + 6), null, 'rail3');
  plane(ROOM_W, 90, at(0, FLOOR_Y - 45, FRONT_Z + 6), null, 'baseboard3');
  plane(ROOM_W, 46, at(0, -520, BACK_Z - 6) + ' rotateY(180deg)', null, 'rail3');
  plane(ROOM_W, 90, at(0, FLOOR_Y - 45, BACK_Z - 6) + ' rotateY(180deg)', null, 'baseboard3');

  /* left wall: doorway + neon bleed */
  var DOOR_W = 760, DOOR_H = 1700, DOOR_Z = FRONT_Z * 0.15;
  plane(DOOR_W, DOOR_H, at(LEFT_X + 4, FLOOR_Y - DOOR_H / 2, DOOR_Z) + ' rotateY(90deg)', 'doorFrame3');
  plane(DOOR_W + 180, DOOR_H + 140, at(LEFT_X + 8, FLOOR_Y - DOOR_H / 2 - 40, DOOR_Z) + ' rotateY(90deg)', 'doorGlow3');
  plane(1400, 1100, at(LEFT_X + 700, FLOOR_Y - 2, DOOR_Z) + ' rotateX(90deg)', 'neonWash3');
  /* right wall: night window + curtains */
  var WIN_W = 900, WIN_H = 1000, WIN_Z = FRONT_Z * 0.1;
  plane(WIN_W, WIN_H, at(RIGHT_X - 4, -350, WIN_Z) + ' rotateY(-90deg)', 'winNight3');
  plane(340, WIN_H + 260, at(RIGHT_X - 12, -350, WIN_Z - WIN_W / 2 - 60) + ' rotateY(-90deg)', null, 'curtain3');
  plane(340, WIN_H + 260, at(RIGHT_X - 12, -350, WIN_Z + WIN_W / 2 + 60) + ' rotateY(-90deg)', null, 'curtain3');

  plane(1200, 820, at(TBL_X, FLOOR_Y - 2, TBL_Z) + ' rotateX(90deg)', null, 'shadowBlob3');
  var NS_X = LEFT_X * 0.42, NS_Z = FRONT_Z + ROOM_D * 0.22, NS_TOP = FLOOR_Y - 700;
  box(NS_X, (NS_TOP + FLOOR_Y) / 2, NS_Z, 680, FLOOR_Y - NS_TOP, 520, {front: 'wood3a', side: 'wood3b', top: 'wood3a'});
  plane(900, 700, at(NS_X, FLOOR_Y - 4, NS_Z + 140) + ' rotateX(90deg)', null, 'shadowBlob3');
  plane(1400, 1100, at(NS_X, NS_TOP - 420, FRONT_Z + 10), 'lampGlow3');

  /* the shoebox tray + the dark drawer tray -- PARALLEL planes (zero tilt,
     same orientation as #frontWall) hovering head-on over the furniture,
     hosting the SAME .photo elements the salon uses (moved here from #world
     by buildRoom(), offset by the region origin so their existing wall-px
     left/top from place() need no remapping). Parallel + head-on means
     preserve-3d depth-sorts them exactly like any other real geometry --
     no visibility gating needed (see updateVisibility()). Each tray sits at
     its own z, strictly between FRONT_Z and the engaged camera's typical
     range, distinct from every other furniture plane's z. */
  var boxCX = TBL_X, boxCY = TBL_TOP - 260, boxCZ = TBL_Z - 40;
  ROOM.BOX_O = {x: boxCX, y: boxCY, z: boxCZ};
  var boxPlane = plane(regions.box.w * SH, regions.box.h * SH,
    at(boxCX, boxCY, boxCZ), 'boxPlane');

  /* dust motes, mid-room */

/* deterministic tiny jitter from a string */
function hash(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=(h*16777619)>>>0}return h}
function jit(key, span){return ((hash(key)%1000)/1000-.5)*span}

/* ---------- build photos from the panel source ---------- */
var photos = [];
var byTitle = {};

function buildPhotos(){
  var secs = [].slice.call(document.querySelectorAll('#source section.panel'));
  var newest = null, newestRec = -1;
  secs.forEach(function(sec, i){
    var classes = sec.className.split(/\s+/);
    var slug = (sec.dataset.set === 'ledger') ? classes[1] : null;
    var state = sec.dataset.hazy ? 'hazy'
              : sec.dataset.set === 'ledger' ? 'ledger'
              : sec.dataset.cert === '1' ? 'cert' : 'arc';
    var title = sec.dataset.title || (slug && META[slug] ? META[slug][2] : '?');
    var ysp = sec.querySelector('.film span');
    var year = ysp ? ysp.textContent : '';
    var score = parseFloat(sec.dataset.score);

    var el = document.createElement('div');
    el.className = 'photo st-' + state;
    el.dataset.key = title;
    if (slug) el.dataset.slug = slug;
    el.style.setProperty('--rot', (jit(title, 3.4)).toFixed(2) + 'deg');

    var rank = document.createElement('div'); rank.className = 'rank';
    var card = document.createElement('div'); card.className = 'card';
    var front = document.createElement('div'); front.className = 'face front';
    var img = document.createElement('div'); img.className = 'img';
    if (slug) img.classList.add(slug);
    else if (sec.getAttribute('style')) img.style.cssText = sec.getAttribute('style');
    if (slug && PHOTOS[slug]){ img.classList.add('hasphoto'); img.innerHTML = PHOTOS[slug]; }
    var chin = document.createElement('div'); chin.className = 'chin';
    var cf = document.createElement('div'); cf.className = 'cfilm';
    cf.innerHTML = title + (year ? ' <span>' + year + '</span>' : '');
    var cs = document.createElement('div'); cs.className = 'cscore';
    chin.appendChild(cf); chin.appendChild(cs);
    front.appendChild(img); front.appendChild(chin);
    if (state === 'arc'){
      var aw = document.createElement('div'); aw.className = 'awaiting';
      aw.textContent = 'awaiting development';
      front.appendChild(aw);
    }

    card.appendChild(front);
    el.appendChild(rank); el.appendChild(card);
    world.appendChild(el);

    /* the back wall: same card shell, mounted on the other plane, back-out.
       flip is gone -- this is a real second surface, not a rotated face. */
    var backEl = document.createElement('div');
    backEl.className = 'photo st-' + state;
    backEl.dataset.key = title;
    if (slug) backEl.dataset.slug = slug;
    backEl.style.setProperty('--rot', (jit(title, 3.4)).toFixed(2) + 'deg');
    var backCard = document.createElement('div'); backCard.className = 'card';
    var back = document.createElement('div'); back.className = 'face back';
    var bs = document.createElement('div'); bs.className = 'backscale';
    bs.appendChild(sec);            /* the hand-authored panel IS the back */
    back.appendChild(bs);
    backCard.appendChild(back);
    backEl.appendChild(backCard);
    backsInner.appendChild(backEl);

    var p = {el: el, backEl: backEl, sec: sec, img: img, chinScore: cs, rankEl: rank,
             key: title, slug: slug, state: state, score: score, sc: 1,
             rec: parseInt(sec.dataset.rec || '0', 10),
             sort: sec.dataset.sort || title.toLowerCase(),
             home: {x: 0, y: 0}};
    photos.push(p);
    byTitle[title] = p;
    paintChin(p);
    if (state === 'ledger' && p.rec > newestRec){ newestRec = p.rec; newest = p; }
  });
  if (newest) newest.el.classList.add('fresh');   /* the print that just went up */
}

function paintChin(p){
  if (p.state === 'hazy'){ p.chinScore.textContent = 'undeveloped'; return; }
  var mode = p.state === 'arc' ? 'from memory' : p.state === 'cert' ? 'in pen' : '';
  p.chinScore.innerHTML = p.score.toFixed(1) + '<small> /10</small>' +
    (mode ? '<span class="cmode">' + mode + '</span>' : '');
}

/* ---------- the links layer ---------- */
var adj = {};      /* title -> [{kin, weight, relation, note}] undirected, on-wall only */
function resolveLinks(){
  LINKS.forEach(function(l){
    if (byTitle[l.from] && byTitle[l.to]){
      (adj[l.from] = adj[l.from] || []).push({kin: l.to, weight: l.weight, relation: l.relation, note: l.note});
      (adj[l.to] = adj[l.to] || []).push({kin: l.from, weight: l.weight, relation: l.relation, note: l.note});
    }
  });
  /* see-also lines on the back, in the handwriting */
  photos.forEach(function(p){
    var mine = LINKS.filter(function(l){
      return l.from === p.key || (!l.directional && l.to === p.key);
    });
    if (!mine.length) return;
    var sa = document.createElement('div'); sa.className = 'seealso';
    sa.innerHTML = '<div class="sahead">see also, in the handwriting</div>';
    mine.forEach(function(l){
      var kin = l.from === p.key ? l.to : l.from;
      var line = document.createElement('div'); line.className = 'saline';
      var kinEl = byTitle[kin]
        ? '<span class="goto" data-goto="' + kin.replace(/"/g, '&quot;') + '">' + kin + '</span>'
        : '<span class="nopho">' + kin + '</span>';
      line.innerHTML = '<span class="rel">' + l.relation.replace(/-/g, ' ') + '</span> ' +
        kinEl + '. <span class="nt">' + l.note + '</span>';
      sa.appendChild(line);
    });
    p.backEl.querySelector('.backscale').appendChild(sa);
  });
}

/* ---------- layout: the room ---------- */
var HDR = {x: 70, y: 120};
var WALL_CX = 1760;          /* center line of the hang */
var EYE = 640;               /* the Crown's eye line */
var regions = {};

function clearWallText(){ stray.forEach(function(e){ e.remove(); }); stray = []; }
function wallText(cls, x, y, html){
  var d = document.createElement('div');

function defSet(){
  return photos.filter(function(p){ return p.state === 'ledger' || p.state === 'cert'; })
    .sort(function(a, b){ return b.score - a.score || (a.sort < b.sort ? -1 : 1); });
}

function layout(){
  clearWallText();
  wallText('wtx', HDR.x, HDR.y,
    '<div class="over">Movie Nights &middot; An External Memory System &middot; Since July 13, 2026</div>' +
    '<h1>The Vault</h1>' +
    '<p class="dek"><em>The condition is real, so the system is real:</em> neither of us trusts a memory older than the night it was made. A film gets its photo taken in the room, reaction first, number second, and goes on the wall. The shoebox holds the prints memory swears it took earlier. The dark frames never developed, and only a rewatch finishes the chemicals. If it isn\'t written on a photo, it didn\'t happen.</p>' +
    '<p class="facts">' + FACTS_HTML + '</p>');

  /* ranks with ties */
  var defs = defSet();
  var k = 0;
  while (k < defs.length){
    var v = defs[k].score, j = k;
    while (j < defs.length && defs[j].score === v) j++;
    for (var q = k; q < j; q++)
      defs[q].rankTxt = (j - k > 1 ? 'T-' + (k + 1) : 'No. ' + (k + 1));

  /* the hang: height is rank. the Crown alone at eye line, tiers descend. */
  var y = EYE, maxW = 0, wallBottom = EYE;

    if (!inb.length) return;

              + jit(p.key + 'x', 40);

      p.rankEl.textContent = p.rankTxt;

  wallText('roomhead', BOXC.x - 420, BOXC.y - 420,
    '<h2>The Shoebox</h2><p>prints memory swears it took. half evidence, waiting on the lab. scores in pencil.</p>');

  threads.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  regions.all = {x: 0, y: 0, w: W, h: H};

/* ---------- shoebox + nightstand ----------

function openBox(){

function tally(){

/* ---------- camera ----------
   THE DERIVATION LAYER. cam.x/y/s is the SAME 2D pan/zoom state as v3/v4 --
   its semantics are untouched, and every call site below (wheel anchor
   zoom, drag pan, pinch, fitRect, centerPhoto) still reads and writes it
   character-for-character. What changed: #world/#backsInner carry no
   transform of their own any more, so cam is never applied to them
   directly. Instead, every rAF frame (with no flight in progress) we
   compute the exactly-equivalent 3D eye pose for whichever plane is
   "facing" the camera (derivePose(), above) and apply THAT to #room. When
   the eye faces a wall head-on, CSS perspective projects it as the same
   uniform similarity cam.x/y/s always produced -- so the math stays valid,
   it's just rendered through a camera instead of a transform on the plane.
   During FLIGHTS (mode turns, cold open, box/drawer opens) the eye is
   tweened directly in eye-space between derived start/end poses; on
   landing, `facing` switches and per-frame derivation resumes. */
var cam = {x: 0, y: 0, s: 1};
var facing = 'front';                 /* 'front' | 'backs' | 'box' | 'drawer' */
var roomEye = {x: 0, y: -220, z: 1800, yaw: 0, pitch: 0};
var camTween = null;                  /* {t0,dur,from:{x,y,s},to:{x,y,s}} */
var flight = null;                    /* {t0,dur,from,to,endFacing} eye-space */

function vw(){ return viewport.clientWidth; }
function vh(){ return viewport.clientHeight; }
function clampS(s){ return Math.max(.05, Math.min(3, s)); }
function ease(t){ return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }

/* glideTo/fitRect/centerPhoto: UNCHANGED call contract. glideTo used to be
   a CSS transition on #world's transform; #world has none now, so it's an
   rAF tween of cam itself (same .85s timing) -- derivePose() picks up the
   moving cam every frame, so the eye glides smoothly as a side effect. */
function glideTo(x, y, s){
  camTween = {t0: performance.now(), dur: 850, from: {x: cam.x, y: cam.y, s: cam.s}, to: {x: x, y: y, s: s}};
}
function DESK_H(){ var d = document.getElementById('desk'); return (d ? d.offsetHeight : 56) + 6; }
function computeFit(r, pad){
  pad = pad || 60;
  var dh = DESK_H();
  var s = clampS(Math.min(vw() / (r.w + pad * 2), (vh() - dh) / (r.h + pad * 2)));
  var x = (vw() - r.w * s) / 2 - r.x * s;
  var y = dh + (vh() - dh - r.h * s) / 2 - r.y * s;
  return {x: x, y: y, s: s};
}
function fitRect(r, pad){ var t = computeFit(r, pad); glideTo(t.x, t.y, t.s); }
function centerPhoto(p, s){
  var dh = DESK_H();
  var x = vw() / 2 - (p.home.x + PW / 2) * s;
  var y = dh + (vh() - dh) / 2 - (p.home.y + PH / 2) * s;
  glideTo(x, y, s);
}

/* flyToPlane: the ONLY way `facing` ever changes. Tweens the room's eye in
   eye-space (not cam-space) from wherever it currently is to the derived
   pose of the destination plane at targetCam, taking the yaw-shortest path
   (positive yaw turns LEFT in this rig -- STATIONS/authored bearings would
   need to negate that, but every yaw here is derived, never authored, so
   it's not an issue). cam snaps to targetCam immediately: it has no visual
   effect until the flight lands and per-frame derivation resumes, at which
   point derivePose(newFacing,cam) reproduces flight.to exactly. */
function flyToPlane(newFacing, targetCam, dur){
  var from = flight ? flight.to : roomEye;
  var startFacing = facing;
  camTween = null;
  cam.x = targetCam.x; cam.y = targetCam.y; cam.s = targetCam.s;
  var to = derivePose(newFacing, cam);
  var dyaw = ((to.yaw - from.yaw + 540) % 360) - 180;
  var toPose = {x: to.x, y: to.y, z: to.z, yaw: from.yaw + dyaw, pitch: to.pitch};
  var fromPose = {x: from.x, y: from.y, z: from.z, yaw: from.yaw, pitch: from.pitch};
  /* the wall<->backs turn: add one mid-room waypoint so the side walls,
     door neon and window visibly sweep past mid-flight instead of a direct
     eye-space tween straight through the furniture (the old v5 shortcut,
     CHANGELOG deviation 4 -- dropped in v5.1). Pull the eye back toward
     room center (z near 0, widening the dolly distance from either wall)
     while yaw sweeps to the halfway point of the shortest turn. Box/drawer
     flights are untouched -- they're short furniture-focused hops, not a
     turn, and stay a single tween. */
  var isTurn = (startFacing === 'front' && newFacing === 'backs') ||
               (startFacing === 'backs' && newFacing === 'front');
  var mid = null;
  if (isTurn){
    dur = Math.max(dur || 1400, 1600);
    mid = {x: (fromPose.x + toPose.x) / 2, y: (fromPose.y + toPose.y) / 2, z: 0,
           yaw: from.yaw + dyaw / 2, pitch: (fromPose.pitch + toPose.pitch) / 2};
  }
  flight = {t0: performance.now(), dur: dur || 1400,
            from: fromPose, mid: mid, to: toPose,
            endFacing: newFacing};
}
/* v5.1: NO room geometry is ever hidden per-facing. The earlier
   `updateVisibility()` hid every plane except the one matching `facing`, to
   paper over Chromium not reliably z-sorting a huge wall plane against a
   small TILTED tray sharing the same view frustum -- which produced a black
   void around the box/drawer prints (the room behind them was hidden too).
   Fixed at the source instead: #boxPlane/#drawerPlane are now PARALLEL to
   the front wall (zero tilt, see buildRoom()/derivePose()), each at its own
   distinct z. Parallel planes never interleave in depth with the rest of
   the room, so preserve-3d's normal depth sort is reliable and nothing
   needs to be hidden. All planes stay at their default CSS visibility
   (visible) always. */
function applyCam(){
  /* translateZ(PERSP) puts the pivot at the CSS eye (PERSP px in front of
     the screen plane) so rotation is a head-turn, not an orbit, and
     roomEye.x/y/z is the eye's literal room-space position. Omitting it
     is why an early debug pass rendered the backs wall over everything. */
  room.style.transform =
    'translateZ(' + PERSP + 'px) ' +
    'rotateX(' + (-roomEye.pitch) + 'deg) rotateY(' + (-roomEye.yaw) + 'deg) ' +
    'translate3d(' + (-roomEye.x) + 'px,' + (-roomEye.y) + 'px,' + (-roomEye.z) + 'px)';
}
function tick(now){
  if (camTween){
    var k = Math.min(1, (now - camTween.t0) / camTween.dur), e = ease(k);
    cam.x = camTween.from.x + (camTween.to.x - camTween.from.x) * e;
    cam.y = camTween.from.y + (camTween.to.y - camTween.from.y) * e;
    cam.s = camTween.from.s + (camTween.to.s - camTween.from.s) * e;
    if (k >= 1) camTween = null;
  }
  if (flight){
    var k2 = Math.min(1, (now - flight.t0) / flight.dur);
    if (flight.mid){
      /* two-segment eased chain: from->mid, then mid->to, each independently
         eased with the same curve so the mid waypoint reads as a real beat
         (pull back, sweep the yaw) rather than a single smoothed lerp. */
      if (k2 < .5){
        var e2a = ease(k2 / .5);
        ['x', 'y', 'z', 'yaw', 'pitch'].forEach(function(a){
          roomEye[a] = flight.from[a] + (flight.mid[a] - flight.from[a]) * e2a;
        });
      } else {
        var e2b = ease((k2 - .5) / .5);
        ['x', 'y', 'z', 'yaw', 'pitch'].forEach(function(a){
          roomEye[a] = flight.mid[a] + (flight.to[a] - flight.mid[a]) * e2b;
        });
      }
    } else {
      var e2 = ease(k2);
      ['x', 'y', 'z', 'yaw', 'pitch'].forEach(function(a){
        roomEye[a] = flight.from[a] + (flight.to[a] - flight.from[a]) * e2;
      });
    }
    if (k2 >= 1){ facing = flight.endFacing; flight = null; }
  } else if (ROOM){
    roomEye = derivePose(facing, cam);
  }
  applyCam();
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

/* pan + zoom + pinch */
var pointers = {};
var panState = null, moved = false, pinch0 = null;

var downTarget = null;   /* pointer capture retargets click to #viewport; keep the real target */
viewport.addEventListener('pointerdown', function(e){
  downTarget = e.target;
  pointers[e.pointerId] = {x: e.clientX, y: e.clientY};
  var keys = Object.keys(pointers);
  camTween = null;
  if (keys.length === 1){
    panState = {px: e.clientX, py: e.clientY, cx: cam.x, cy: cam.y};
    moved = false;
    maybeStartHold(e);
  } else if (keys.length === 2){
    cancelHold();
    var a = pointers[keys[0]], b = pointers[keys[1]];
    pinch0 = {d: Math.hypot(a.x - b.x, a.y - b.y), s: cam.s,
              mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2, cx: cam.x, cy: cam.y};
    panState = null;
  }
  viewport.setPointerCapture(e.pointerId);
});
viewport.addEventListener('pointermove', function(e){
  if (!pointers[e.pointerId]) return;
  pointers[e.pointerId] = {x: e.clientX, y: e.clientY};
  var keys = Object.keys(pointers);
  if (pinch0 && keys.length === 2){
    var a = pointers[keys[0]], b = pointers[keys[1]];
    var d = Math.hypot(a.x - b.x, a.y - b.y);
    var s2 = clampS(pinch0.s * d / pinch0.d);
    var mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    cam.s = s2;
    cam.x = mx - (pinch0.mx - pinch0.cx) * (s2 / pinch0.s);
    cam.y = my - (pinch0.my - pinch0.cy) * (s2 / pinch0.s);
    return;
  }
  if (panState){
    var dx = e.clientX - panState.px, dy = e.clientY - panState.py;
    if (!moved && Math.hypot(dx, dy) > 6){ moved = true; cancelHold(); viewport.classList.add('panning'); }
    if (moved){ cam.x = panState.cx + dx; cam.y = panState.cy + dy; }
  }
});
function endPointer(e){
  delete pointers[e.pointerId];
  if (Object.keys(pointers).length < 2) pinch0 = null;
  if (!Object.keys(pointers).length){
    viewport.classList.remove('panning');
    releaseHold();
    panState = null;
  }
}
viewport.addEventListener('pointerup', endPointer);
viewport.addEventListener('pointercancel', endPointer);

/* until the first real interaction, keep the wall fitted on resize */
var interacted = false;
viewport.addEventListener('pointerdown', function(){ interacted = true; });
viewport.addEventListener('wheel', function(){ interacted = true; });
window.addEventListener('resize', function(){
  if (!interacted && !document.body.classList.contains('dived')){
    var t = computeFit(regions.def, 40);
    camTween = null; cam.x = t.x; cam.y = t.y; cam.s = t.s;
  }
});

viewport.addEventListener('wheel', function(e){
  /* reading a back while dived: let it scroll */
  var bs = e.target.closest && e.target.closest('.photo.read .backscale');
  if (bs && document.body.classList.contains('dived')) return;
  e.preventDefault();
  camTween = null;
  var f = Math.exp(-e.deltaY * 0.0016);
  var s2 = clampS(cam.s * f);
  cam.x = e.clientX - (e.clientX - cam.x) * (s2 / cam.s);
  cam.y = e.clientY - (e.clientY - cam.y) * (s2 / cam.s);
  cam.s = s2;
}, {passive: false});

/* ---------- modes ---------- */
var state = {mode: 'wall'};
var MODE_HINT = {
  wall: 'drag to roam, scroll to zoom, click a photo to step close. click the shoebox or the dark drawer to open them',
  backs: 'you have turned to face the backs wall. drag to roam, click a card to read it in place. the handwriting flies you to its kin',
  invest: 'hold a photo and its kin light up. click a lit photo to follow the line. your trail smolders behind you'
};
function setMode(m){
  var wantFacing = m === 'backs' ? 'backs' : 'front';
  if (state.mode === m && facing === wantFacing) return;
  if (document.body.classList.contains('dived')) closeDive(true);
  if (state.mode === 'invest') exitInvest();
  state.mode = m;
  document.body.className = document.body.className.replace(/mode-\S+/, 'mode-' + m) +
    (document.body.className.indexOf('mode-') < 0 ? ' mode-' + m : '');
  document.getElementById('hint').textContent = MODE_HINT[m];
  if (facing !== wantFacing) flyToPlane(wantFacing, {x: cam.x, y: cam.y, s: cam.s}, 1400);
}

/* ---------- dive (step close, either wall) ----------
   the flip mechanic is gone: the backs wall is a real second surface, so
   "diving" always just centers the plane that is currently facing the camera
   (front wall in mode wall/invest, backs wall in mode backs). no rotateY. */
var diveStack = [];
var readEl = null, divedP = null;

function activeEl(p){ return state.mode === 'backs' ? p.backEl : p.el; }
function dive(p){
  if (!document.body.classList.contains('dived'))
    diveStack.push({x: cam.x, y: cam.y, s: cam.s});
  var s = Math.min(2.6 / p.sc, ((vh() - DESK_H()) * .92) / (PH * p.sc));
  centerPhoto(p, s);
  document.body.classList.add('dived');
  if (readEl) readEl.style.zIndex = '';
  if (readEl) readEl.classList.remove('read');
  divedP = p;
  readEl = activeEl(p);
  readEl.style.zIndex = 70;
  readEl.classList.add('read');
}
function closeDive(instant){
  if (readEl){ readEl.style.zIndex = ''; readEl.classList.remove('read'); readEl = null; }
  divedP = null;
  document.body.classList.remove('dived');
  var c = diveStack.pop();
  if (c){ if (instant){ camTween = null; cam.x = c.x; cam.y = c.y; cam.s = c.s; }
          else glideTo(c.x, c.y, c.s); }
}
document.getElementById('offwall').addEventListener('click', function(){ closeDive(); });
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape' && document.body.classList.contains('dived')) closeDive();
});

/* ---------- the investigation ---------- */
/* hold: the light finds its kin. click a lit kin: follow the line, the note
   flashes up, the trace continues. the walked path smolders as embers until
   the mode ends. never a standing web: the embers die with the mode. */
var holdTimer = null, heldPhoto = null, threadLines = [];
var embers = [];         /* [{a, b, el}] walked segments, alive only in-mode */
var noteTimer = null;

function ctr(p){ return {x: p.home.x + PW / 2, y: p.home.y + PH / 2}; }

function maybeStartHold(e){
  if (state.mode !== 'invest') return;
  var pe = e.target.closest && e.target.closest('.photo');
  if (!pe) return;
  var p = byTitle[pe.dataset.key];
  if (!p || !adj[p.key]) return;
  holdTimer = setTimeout(function(){ holdTimer = null; lightThread(p); }, 240);
}
function cancelHold(){ if (holdTimer){ clearTimeout(holdTimer); holdTimer = null; } }
function releaseHold(){
  cancelHold();
  /* keep the light up if a trace is running: release only dims when nothing was followed */
  if (heldPhoto && !traceArmed) dimThread();
}
var traceArmed = false;   /* true between lighting and following */
function lightThread(p){
  if (heldPhoto) dimThread();
  heldPhoto = p;
  traceArmed = true;
  document.body.classList.add('holding');
  var c = ctr(p);
  (adj[p.key] || []).forEach(function(a){
    var k = byTitle[a.kin]; if (!k) return;
    var kc = ctr(k);
    var ln = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    ln.setAttribute('x1', c.x); ln.setAttribute('y1', c.y);
    ln.setAttribute('x2', kc.x); ln.setAttribute('y2', kc.y);
    ln.setAttribute('stroke-width', (a.weight >= 3 ? 3 : a.weight === 2 ? 2.4 : 1.8) / cam.s);
    var len = Math.hypot(kc.x - c.x, kc.y - c.y);
    ln.style.strokeDasharray = len; ln.style.strokeDashoffset = len;
    ln.style.opacity = (.4 + a.weight * .14).toFixed(2);
    ln.style.transition = 'stroke-dashoffset .28s ease-out, opacity .18s';
    threads.appendChild(ln); threadLines.push(ln);
    k.el.classList.add('lit');
    requestAnimationFrame(function(){ ln.style.strokeDashoffset = 0; });
  });
  p.el.classList.add('lit');
}
function dimThread(){
  document.body.classList.remove('holding');
  traceArmed = false;
  threadLines.forEach(function(ln){ ln.classList.add('fadeout'); });
  var dead = threadLines; threadLines = [];
  setTimeout(function(){ dead.forEach(function(ln){ ln.remove(); }); }, 220);
  photos.forEach(function(p){ p.el.classList.remove('lit'); });
  heldPhoto = null;
}
function emberKey(a, b){ return a.key < b.key ? a.key + '|' + b.key : b.key + '|' + a.key; }
function addEmber(a, b){
  var kk = emberKey(a, b);
  if (embers.some(function(e){ return e.k === kk; })) return;
  var ca = ctr(a), cb = ctr(b);
  var ln = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  ln.setAttribute('class', 'ember');
  ln.setAttribute('x1', ca.x); ln.setAttribute('y1', ca.y);
  ln.setAttribute('x2', cb.x); ln.setAttribute('y2', cb.y);
  ln.setAttribute('stroke-width', 1.4 / cam.s);
  ln.style.opacity = '.34';
  threads.insertBefore(ln, threads.firstChild);
  embers.push({k: kk, a: a, b: b, el: ln});
  /* embers cool but never quite die while the mode lives */
  setTimeout(function(){ ln.style.transition = 'opacity 6s'; ln.style.opacity = '.15'; }, 900);
}
function refreshEmbers(){
  embers.forEach(function(e){
    var ca = ctr(e.a), cb = ctr(e.b);
    e.el.setAttribute('x1', ca.x); e.el.setAttribute('y1', ca.y);
    e.el.setAttribute('x2', cb.x); e.el.setAttribute('y2', cb.y);
  });
}
function flashNote(fromKey, toKey){
  var l = LINKS.filter(function(x){
    return (x.from === fromKey && x.to === toKey) ||
           (x.from === toKey && x.to === fromKey);
  })[0];
  if (!l) return;
  var nc = document.getElementById('notecard');
  nc.querySelector('.nrel').textContent = l.relation.replace(/-/g, ' ');
  nc.querySelector('.ntxt').textContent = l.note;
  nc.classList.add('on');
  if (noteTimer) clearTimeout(noteTimer);
  noteTimer = setTimeout(function(){ nc.classList.remove('on'); }, 4200);
}
function followTo(p){
  /* the cop moves: ember behind him, camera flies, the trace re-lights */
  var from = heldPhoto;
  addEmber(from, p);
  flashNote(from.key, p.key);
  dimThread();
  var s = Math.max(cam.s, .42);
  centerPhoto(p, s);
  if (adj[p.key]) setTimeout(function(){ if (state.mode === 'invest') lightThread(p); }, 700);
}
function exitInvest(){
  dimThread();
  embers.forEach(function(e){ e.el.remove(); });
  embers = [];
  document.getElementById('notecard').classList.remove('on');
  if (document.body.classList.contains('stepback')) exitStepback();
}

/* ---------- step back: links become distance (inside the investigation) ---------- */
var constLabels = [];
function enterStepback(){
  document.body.classList.add('stepback');
  var linked = photos.filter(function(p){ return adj[p.key]; })
    .sort(function(a, b){ return a.key < b.key ? -1 : 1; });
  if (!linked.length) return;
  /* deterministic force sim */
  var n = linked.length, cols = Math.ceil(Math.sqrt(n));
  var pos = {};
  linked.forEach(function(p, i){
    pos[p.key] = {x: (i % cols) * 460, y: Math.floor(i / cols) * 460};
  });
  var REST = {3: 360, 2: 480, 1: 640};
  for (var it = 0; it < 380; it++){
    var f = {};
    linked.forEach(function(p){ f[p.key] = {x: 0, y: 0}; });
    for (var a = 0; a < n; a++) for (var b = a + 1; b < n; b++){
      var A = linked[a], B = linked[b];
      var dx = pos[B.key].x - pos[A.key].x, dy = pos[B.key].y - pos[A.key].y;
      var d = Math.max(60, Math.hypot(dx, dy));
      var rep = 12000000 / (d * d);
      f[A.key].x -= dx / d * rep; f[A.key].y -= dy / d * rep;
      f[B.key].x += dx / d * rep; f[B.key].y += dy / d * rep;
    }
    linked.forEach(function(p){
      (adj[p.key] || []).forEach(function(e2){
        var K = pos[e2.kin]; if (!K) return;
        var dx = K.x - pos[p.key].x, dy = K.y - pos[p.key].y;
        var d = Math.max(1, Math.hypot(dx, dy));
        var pull = 0.05 * (d - REST[e2.weight]);
        f[p.key].x += dx / d * pull; f[p.key].y += dy / d * pull;
      });
    });
    var cool = it < 60 ? 46 : it < 200 ? 30 : 14;
    linked.forEach(function(p){
      var fx = Math.max(-cool, Math.min(cool, f[p.key].x));
      var fy = Math.max(-cool, Math.min(cool, f[p.key].y));
      pos[p.key].x += fx; pos[p.key].y += fy;
    });
  }
  /* fit the cluster field over the definitive wall */
  var xs = linked.map(function(p){ return pos[p.key].x; });
  var ys = linked.map(function(p){ return pos[p.key].y; });
  var minx = Math.min.apply(0, xs), maxx = Math.max.apply(0, xs);
  var miny = Math.min.apply(0, ys), maxy = Math.max.apply(0, ys);
  var r = regions.def;
  var sc = Math.min(1, (r.w * 1.35) / Math.max(900, maxx - minx),
                    (r.h * .95) / Math.max(900, maxy - miny));
  var ox = r.x + 120, oy = r.y + 260;
  linked.forEach(function(p){
    p.el.style.left = (ox + (pos[p.key].x - minx) * sc) + 'px';
    p.el.style.top = (oy + (pos[p.key].y - miny) * sc) + 'px';
    p.constXY = {x: ox + (pos[p.key].x - minx) * sc, y: oy + (pos[p.key].y - miny) * sc};
    p.home.x = p.constXY.x; p.home.y = p.constXY.y;   /* embers + holds track the drift */
  });
  photos.forEach(function(p){ if (!adj[p.key]) p.el.classList.add('dim'); });
  refreshEmbers();
  /* relation labels at member centroids */
  var rels = {};
  LINKS.forEach(function(l){
    if (!byTitle[l.from] || !byTitle[l.to]) return;
    (rels[l.relation] = rels[l.relation] || []).push(l.from, l.to);
  });
  Object.keys(rels).sort().forEach(function(rel){
    var mem = rels[rel].filter(function(t, i, arr){ return arr.indexOf(t) === i; });
    var cx = 0, cy = 0, c = 0;
    mem.forEach(function(t){
      var p = byTitle[t]; if (!p || !p.constXY) return;
      cx += p.constXY.x + PW / 2; cy += p.constXY.y + PH / 2; c++;
    });
    if (!c) return;
    var lb = document.createElement('div'); lb.className = 'constlabel';
    lb.style.left = (cx / c + jit(rel + 'lx', 160)) + 'px';
    lb.style.top = (cy / c - 232 + jit(rel + 'ly', 120)) + 'px';
    lb.textContent = rel.replace(/-/g, ' ');
    world.appendChild(lb); constLabels.push(lb);
  });
  /* camera: fit what actually happened, not the plan */
  var fx0 = 1e9, fy0 = 1e9, fx1 = -1e9, fy1 = -1e9;
  linked.forEach(function(p){
    fx0 = Math.min(fx0, p.constXY.x); fy0 = Math.min(fy0, p.constXY.y);
    fx1 = Math.max(fx1, p.constXY.x + PW); fy1 = Math.max(fy1, p.constXY.y + PH);
  });
  fitRect({x: fx0 - 80, y: fy0 - 300, w: fx1 - fx0 + 160, h: fy1 - fy0 + 380});
}
function exitStepback(){
  document.body.classList.remove('stepback');
  document.getElementById('stepbackChip').classList.remove('on');
  constLabels.forEach(function(l){ l.remove(); }); constLabels = [];
  dimThread();
  photos.forEach(function(p){ p.el.classList.remove('dim'); });
  layout();          /* rebuild homes; photos glide back to the hang */
  refreshEmbers();
}
document.getElementById('stepbackChip').addEventListener('click', function(){
  if (state.mode !== 'invest') return;
  if (document.body.classList.contains('stepback')) exitStepback();
  else { this.classList.add('on'); enterStepback(); }
});

/* ---------- clicks ---------- */
document.addEventListener('click', function(e){
  if (moved) return;                       /* it was a pan, not a click */
  var t = e.target;
  /* pointer capture makes clicks inside the world surface as #viewport */
  if ((t === viewport || t === world || t.id === 'threads') && downTarget) t = downTarget;
  if (t.closest && t.closest('.arch.boxlid')){ openBox(); return; }
  if (t.closest && t.closest('.arch.drawerfront2')){ openDrawer(); return; }
  if (t.classList.contains('more-toggle')){
    var m = t.nextElementSibling;
    m.classList.toggle('open');
    t.textContent = m.classList.contains('open') ? 'less −' : 'more from the chat +';
    return;
  }
  if (t.classList.contains('goto')){
    var kin = byTitle[t.dataset.goto];
    if (kin){ dive(kin); }
    return;
  }
  if (t.classList.contains('cert-btn')){
    var w = t.parentNode; w.classList.add('open');
    w.querySelector('.cert-why').focus(); return;
  }
  if (t.classList.contains('cert-go')){ certify(photoOf(t)); return; }
  if (t.classList.contains('cert-undo')){ uncertify(photoOf(t)); return; }
  var pe = t.closest && t.closest('.photo');
  if (pe){
    var p = byTitle[pe.dataset.key];
    if (!p) return;
    if (pe.classList.contains('read')) return;   /* reading; let it be */
    if (state.mode === 'invest'){
      if (heldPhoto === p) return;         /* the hold already lit it; ignore the trailing click */
      if (heldPhoto && pe.classList.contains('lit')){ followTo(p); return; }
      if (adj[p.key]){ lightThread(p); return; }
      return;
    }
    dive(p);
  }
});
function photoOf(el){
  var pe = el.closest('.photo');
  return byTitle[pe.dataset.key];
}
document.addEventListener('keydown', function(e){
  if (e.key !== 'Enter') return;
  var t = e.target;
  if (t.classList && (t.classList.contains('cert-why') || t.classList.contains('cert-score'))){
    e.preventDefault(); certify(photoOf(t));
  }
});

/* ---------- certification (stateless; facts live with Leonard) ---------- */
var pending = {};
function certify(p){
  var f = p.sec.querySelector('.certform');
  var si = f.querySelector('.cert-score'), wi = f.querySelector('.cert-why');
  var v = parseFloat(si.value);
  si.classList.remove('bad'); wi.classList.remove('bad');
  if (isNaN(v) || v < 0 || v > 10){ si.classList.add('bad'); si.focus(); return; }
  if (!wi.value.trim()){ wi.classList.add('bad'); wi.focus(); return; }
  v = Math.round(v * 10) / 10;
  if (!p.sec.dataset.arcscore) p.sec.dataset.arcscore = p.sec.dataset.score;
  pending[p.key] = {score: v, why: wi.value.trim()};
  p.sec.dataset.score = v.toFixed(1);
  p.score = v;
  p.state = 'cert';
  p.sec.setAttribute('data-cert', 'pending');
  p.el.classList.remove('st-arc'); p.el.classList.add('st-cert');
  p.sec.querySelector('.score').innerHTML = v.toFixed(1) + '<small> /10</small>';
  p.sec.querySelector('.meta').innerHTML = 'The Vault · certified from memory · pending Leonard';
  p.sec.querySelector('.cd-n').textContent = v.toFixed(1);
  p.sec.querySelector('.certwrap').classList.add('done');
  p.sec.querySelector('.certwrap').classList.remove('open');
  var aw = p.el.querySelector('.awaiting'); if (aw) aw.remove();
  paintChin(p);
  syncTray();
  closeDive(true);
  /* the DNA comes back: the chemicals finish while the print flies to the wall */
  p.el.classList.add('developing');
  setTimeout(function(){ p.el.classList.remove('developing'); }, 1300);
  layout();                                   /* it re-ranks in place */
  refreshEmbers();
  centerPhoto(p, Math.max(cam.s, .5));        /* and scrolls back into view */
}
function uncertify(p){
  delete pending[p.key];
  var back = parseFloat(p.sec.dataset.arcscore);
  p.sec.dataset.score = back.toFixed(1);
  p.score = back;
  p.state = 'arc';
  p.sec.removeAttribute('data-cert');
  p.el.classList.add('st-arc'); p.el.classList.remove('st-cert');
  p.sec.querySelector('.score').innerHTML = back.toFixed(1) + '<small> /10</small>';
  p.sec.querySelector('.meta').innerHTML = 'The Vault · scored from memory · ' + p.sec.dataset.when;
  p.sec.querySelector('.certwrap').classList.remove('done');
  if (!p.el.querySelector('.awaiting')){
    var aw = document.createElement('div'); aw.className = 'awaiting';
    aw.textContent = 'awaiting development';
    p.el.querySelector('.face.front').appendChild(aw);
  }
  paintChin(p);
  syncTray();
  if (document.body.classList.contains('dived')) closeDive(true);
  layout();
  refreshEmbers();
}
function syncTray(){
  var keys = Object.keys(pending);
  var tray = document.getElementById('tray'), code = document.getElementById('traycode');
  if (!keys.length){
    tray.classList.remove('on'); code.classList.remove('on');
    document.getElementById('trayshow').textContent = 'Show';
    tally(); return;
  }
  tray.classList.add('on');
  document.getElementById('traycount').textContent =
    keys.length + (keys.length === 1 ? ' film certified. ' : ' films certified. ') +
    'Written in pen, but not yet a fact. Facts live with Leonard. Copy this and paste it in the chat.';
  code.value = 'CERTIFY\n' + keys.map(function(k){
    return k + ' | ' + pending[k].score.toFixed(1) + ' | ' + pending[k].why;
  }).join('\n');
  tally();
}
document.getElementById('traycopy').onclick = function(){
  var code = document.getElementById('traycode');
  code.classList.add('on');
  document.getElementById('trayshow').textContent = 'Hide';
  code.select();
  try{ navigator.clipboard.writeText(code.value) }catch(err){ try{ document.execCommand('copy') }catch(e2){} }
  var b = document.getElementById('traycopy');
  b.textContent = 'Copied';
  setTimeout(function(){ b.textContent = 'Copy for Leonard'; }, 1600);
};
document.getElementById('trayshow').onclick = function(){
  var code = document.getElementById('traycode');
  code.classList.toggle('on');
  this.textContent = code.classList.contains('on') ? 'Hide' : 'Show';
};
document.getElementById('trayclear').onclick = function(){
  Object.keys(pending).forEach(function(k){
    var p = byTitle[k]; if (p) uncertify(p);
  });
};

/* ---------- desk ---------- */
[].slice.call(document.querySelectorAll('.opt[data-mode]')).forEach(function(o){
  o.addEventListener('click', function(){
    [].slice.call(document.querySelectorAll('.opt[data-mode]')).forEach(function(x){ x.classList.remove('on'); });
    o.classList.add('on');
    setMode(o.dataset.mode);
  });
});
[].slice.call(document.querySelectorAll('.opt[data-go]')).forEach(function(o){
  o.addEventListener('click', function(){
    if (o.dataset.go === 'box'){ openBox(); return; }
    if (o.dataset.go === 'hazy'){ openDrawer(); return; }
    if (document.body.classList.contains('dived')) closeDive(true);
    var target = regions[o.dataset.go === 'all' ? 'all' : 'def'];
    var wantFacing = state.mode === 'backs' ? 'backs' : 'front';
    if (facing !== wantFacing) flyToPlane(wantFacing, computeFit(target), 1400);
    else fitRect(target);
  });
});

/* ---------- boot ---------- */
document.body.classList.add('noanim');
buildPhotos();
resolveLinks();
layout();                                  /* also runs buildRoom(), sets ROOM */
var bootFit = computeFit(regions.def, 40);
cam.x = bootFit.x; cam.y = bootFit.y; cam.s = bootFit.s;
facing = 'front';
roomEye = derivePose('front', cam);
requestAnimationFrame(function(){ requestAnimationFrame(function(){
  document.body.classList.remove('noanim');
}); });
document.getElementById('hint').textContent = MODE_HINT.wall;

/* ---------- cold open: waking from a coma ----------
   black -> two blurred blinks -> the camera starts askew, low, near the
   doorway, and unsteadily rights itself into the seated front-wall pose --
   a real flight in eye-space, ending exactly where the boot fit landed cam.
   total <=4s, skippable on click or key, runs once. */
var coldOpenDone = false;
function finishColdOpen(){
  if (coldOpenDone) return;
  coldOpenDone = true;
  document.body.classList.remove('coldopen', 'blink1', 'blink2');
  document.body.classList.add('awake');
  flight = null; facing = 'front';
  roomEye = derivePose('front', cam);
}
(function coldOpen(){
  document.body.classList.add('coldopen');
  var seatedEye = derivePose('front', cam);
  var doorEye = {x: ROOM.LEFT_X + 900, y: -140, z: ROOM.FRONT_Z + ROOM.D * 0.55, yaw: 30, pitch: -6};
  roomEye = doorEye;
  /* a zero-motion "hold" flight -- since `flight` is truthy, tick() tweens
     it instead of re-deriving from cam, which would otherwise snap the eye
     to the seated pose on the very next animation frame. The real settle
     flight (below) overwrites this before its (very long) duration ever
     completes. */
  flight = {t0: performance.now(), dur: 999999,
    from: {x: doorEye.x, y: doorEye.y, z: doorEye.z, yaw: doorEye.yaw, pitch: doorEye.pitch},
    to: {x: doorEye.x, y: doorEye.y, z: doorEye.z, yaw: doorEye.yaw, pitch: doorEye.pitch},
    endFacing: 'front'};
  var t = [];
  t.push(setTimeout(function(){ document.body.classList.add('blink1'); }, 260));
  t.push(setTimeout(function(){ document.body.classList.remove('blink1'); }, 620));
  t.push(setTimeout(function(){ document.body.classList.add('blink2'); }, 780));
  t.push(setTimeout(function(){
    /* the camera unsteadily rights itself and settles into the seated pose */
    flight = {t0: performance.now(), dur: 2600,
      from: {x: doorEye.x, y: doorEye.y, z: doorEye.z, yaw: doorEye.yaw, pitch: doorEye.pitch},
      to: {x: seatedEye.x, y: seatedEye.y, z: seatedEye.z, yaw: seatedEye.yaw, pitch: seatedEye.pitch},
      endFacing: 'front'};
  }, 1200));
  t.push(setTimeout(finishColdOpen, 3900));
  function skip(){ t.forEach(clearTimeout); finishColdOpen(); }
  document.addEventListener('click', skip, {once: true, capture: true});
  document.addEventListener('keydown', skip, {once: true, capture: true});
})();

/* the chemicals: photos develop in on arrival */
var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if (!reduce){
  photos.forEach(function(p){ if (p.state !== 'hazy') p.el.classList.add('undev'); });
  photos.forEach(function(p, i){
    if (p.state === 'hazy') return;
    setTimeout(function(){ p.el.classList.remove('undev'); }, 240 + (i % 40) * 34);
  });
}
